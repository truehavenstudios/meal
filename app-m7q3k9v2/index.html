<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Low-Energy Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--acc:var(--a);--acc2:var(--a2);--hl:var(--a);--ink2:var(--mute);--ink3:var(--mute);--bg2:var(--bg);--line2:var(--line);--ok:var(--a);--okbg:var(--a2);--bad:var(--warn);--serif:'Bricolage Grotesque',sans-serif;--sans:Figtree,sans-serif;--bg:#f6f3ec;--card:#fffdf8;--ink:#17150f;--mute:#6b675c;--line:#e7e1d3;--a:#3f7d5c;--a2:#e3efe6;--a3:#cfe3d5;--warn:#c8553d;--warn2:#f8e3dc;--sun:#f2c14e;--sun2:#fbefcc;--r:18px}
[data-t=blush]{--a:#c0557a;--a2:#f8e6ec;--a3:#f0cfdb}
[data-t=lavender]{--a:#6f5bb5;--a2:#ece8f8;--a3:#d9d1f1}
[data-t=ocean]{--a:#2f6f8f;--a2:#e2eef4;--a3:#c8dfea}
[data-t=terracotta]{--a:#b4573a;--a2:#f6e6df;--a3:#ecccbf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}h2{font-size:20px;font-weight:800}h3{font-size:16px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a)}
.app{display:flex;min-height:100vh}
nav.side{display:none}
main{flex:1;max-width:760px;margin:0 auto;padding:22px 16px 110px;width:100%}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.kick{font-size:13px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mute{color:var(--mute)}.sm{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:700;background:var(--a2);white-space:nowrap}
.btn.pri{background:var(--a);color:#fff}
.btn.big{padding:16px 22px;font-size:17px;width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.s{padding:8px 13px;font-size:14px}
.ico{width:20px;height:20px;flex:none}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--a2);display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--a2);font-size:13px;font-weight:600}
.chip.warn{background:var(--warn2);color:#7a2c1c}.chip.sun{background:var(--sun2);color:#6b4b00}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--a2);color:var(--a)}
.tile svg{width:24px;height:24px}
/* energy */
.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.en{border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;background:var(--card);font-weight:700}
.en .bat{display:block;margin:0 auto 6px;width:40px;height:20px}
.en.on{border-color:var(--a);background:var(--a2)}
.en small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.hero{background:var(--a);color:#fff;border:0}
.hero .mute{color:#ffffffcc}
.hero .btn{background:#fff;color:var(--ink)}
.hero .btn.ghost{background:transparent;border-color:#ffffff66;color:#fff}
.startby{display:flex;gap:14px;align-items:center;background:#ffffff1f;border-radius:14px;padding:12px 14px;margin:14px 0}
.startby b{font-size:24px;font-family:'Bricolage Grotesque'}
.opt{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.opt:first-child{border-top:0}
.opt .grow{flex:1;min-width:0}
.opt b{display:block}
/* week */
.day{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.dl{width:52px;flex:none}
.dl b{display:block;font-size:15px}.dl span{font-size:12px;color:var(--mute)}
.day.today .dl b{color:var(--a)}
.slot{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:9px 11px;text-align:left}
.slot.empty{border:1.5px dashed var(--line);background:transparent;color:var(--mute);justify-content:center}
.slot .tile{width:36px;height:36px;border-radius:11px}.slot .tile svg{width:19px;height:19px}
.lowtag{font-size:11px;font-weight:700;color:#6b4b00;background:var(--sun2);border-radius:6px;padding:1px 6px;margin-left:6px}
.why{font-size:12px;color:var(--a);font-weight:600}
/* list */
.aisle{margin-top:6px}
.it{display:flex;align-items:center;gap:13px;padding:11px 0;border-top:1px solid var(--line)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--a3);flex:none;display:grid;place-items:center}
.it.done .ck{background:var(--a);border-color:var(--a);color:#fff}
.it.done .nm{text-decoration:line-through;color:var(--mute)}
.nm{flex:1;min-width:0}.nm small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--bg);margin-top:8px}
.fr.hot{background:var(--warn2)}
/* recipes */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.rc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:12px 0}
.filters .chip{background:var(--card);border:1.5px solid var(--line);padding:7px 13px;white-space:nowrap}
.filters .chip.on{background:var(--a);border-color:var(--a);color:#fff}
/* wins */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font:800 26px 'Bricolage Grotesque'}
.stat span{font-size:12px;color:var(--mute);font-weight:600}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
/* nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.bot button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mute);padding:4px 8px;border-radius:12px;min-width:58px}
nav.bot button.on{color:var(--a)}
nav.bot button.on .ico{background:var(--a2);border-radius:10px;box-sizing:content-box;padding:3px 12px}
/* sheet */
.ov{position:fixed;inset:0;background:#17150f55;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet .x{float:right}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{padding:10px 15px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;background:var(--card)}
.pick button.on{border-color:var(--a);background:var(--a2)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
/* cook */
.cook{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.cook .stepx{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:620px;margin:0 auto;width:100%}
.cook .stepx p{font:600 26px/1.3 'Bricolage Grotesque';margin:0 0 22px}
.prog{display:flex;gap:5px;margin-top:10px}.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--a)}
.timer{background:var(--sun2);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;z-index:60;font-size:14px}
.onb{max-width:520px;margin:0 auto;padding:40px 18px}
.empty-note{text-align:center;padding:26px 10px;color:var(--mute)}
@media(min-width:900px){
 nav.bot{display:none}
 nav.side{display:flex;flex-direction:column;gap:4px;width:230px;padding:26px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--card)}
 nav.side .brand{font:800 18px 'Bricolage Grotesque';display:flex;gap:9px;align-items:center;padding:0 10px 18px}
 nav.side button{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--mute);text-align:left}
 nav.side button.on{background:var(--a2);color:var(--ink)}
 main{padding:34px 34px 60px;max-width:880px}
 .grid{grid-template-columns:1fr 1fr}
 .two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
 .toast{bottom:30px}
 .ov{align-items:center}.sheet{border-radius:24px}
}
</style>

<body>
<div id="root"></div>
<script>window.BP_DEMO=false;window.BP_SYNC_URL="https://truehaven-sync.fishing-switzerland.workers.dev";</script>
<script>/* TrueHaven Sync – end-to-end-encrypted device sync for the offline apps (client module).
   One file, no libraries, WebCrypto only. Works in browsers and in Node 20+ (for tests).

   Usage in an app (see README.md):
     const SYNC = THSync.create({
       appId: "bills", appName: "Bill Smoother", storageKey: "thbills.v1", url: window.BP_SYNC_URL, demo: DEMO,
       getState: () => JSON string of the whole state (as it is saved),
       applyState: json => replace the whole state through the app's normal load/migrate path, save it, re-render,
       onChange: notify => { remember notify; call it after every local save },
       describe: json => "12 bills · 3 jars"      (optional, shown in the conflict dialog),
       hasData: () => true if this device holds data worth protecting  (optional),
       validate: json => throws if json isn't this app's data       (optional),
       rerender: () => app re-render                                   (optional)
     });
     SYNC.start();                     // after the app's first render
     SYNC.pillHTML()                   // status pill, put it anywhere (updates itself)
     SYNC.sectionHTML()                // the "Your devices" settings block (updates itself)
     SYNC.openJoin()                   // "I already use it on another device"

   Security model, briefly:
   - Device A makes a random spaceId (128 bit), dataKey (AES-GCM 256) and writeToken (256 bit).
   - Every save is encrypted on the device: AES-GCM, fresh 96-bit IV, additional data = app id + spaceId + version,
     so the server can't swap copies between apps/spaces or pass an old copy off as a newer one.
   - The server stores ciphertext + sha256(writeToken) only. Anyone without the dataKey sees random bytes.
   - Linking: either a 6-digit code (online, server-mediated, see the honest note at pairSeal) or a QR/link whose
     #fragment carries the secrets directly – fragments are never sent to any server.
   - Secrets live in localStorage next to the app's own data (which is plain text there anyway). */
(function (root) {
  "use strict";
  const VERSION = 1;
  const PBKDF2_ITER = 600000;          // OWASP 2023 recommendation for PBKDF2-HMAC-SHA256
  const DEBOUNCE = 3000, POLL = 60000, BACKOFF = [2000, 4000, 8000, 16000, 32000, 60000];
  const MAX_CT = 1800000;              // keep in step with worker.js
  const te = new TextEncoder(), td = new TextDecoder();
  const subtle = () => (root.crypto || globalThis.crypto).subtle;
  const rand = n => { const a = new Uint8Array(n); (root.crypto || globalThis.crypto).getRandomValues(a); return a; };

  // ------------------------------------------------------------------ bytes
  function b64(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
  function unb64(s) { const t = atob(s), a = new Uint8Array(t.length); for (let i = 0; i < t.length; i++) a[i] = t.charCodeAt(i); return a; }
  const b64url = bytes => b64(bytes).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const unb64url = s => unb64(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
  const cat = (...arrs) => { const n = arrs.reduce((a, x) => a + x.length, 0), o = new Uint8Array(n); let p = 0; for (const x of arrs) { o.set(x, p); p += x.length; } return o; };
  async function sha256hex(s) { const d = await subtle().digest("SHA-256", te.encode(s)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join(""); }

  async function pipe(bytes, Stream, mode) {
    const s = new Blob([bytes]).stream().pipeThrough(new Stream(mode));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  const canZip = () => typeof CompressionStream === "function" && typeof DecompressionStream === "function";

  // ------------------------------------------------------------------ crypto
  function newSecrets() { return { space: b64url(rand(16)), key: b64url(rand(32)), token: b64url(rand(32)) }; }
  const keyCache = new Map();
  async function dataKey(k) {
    if (!keyCache.has(k)) keyCache.set(k, await subtle().importKey("raw", unb64url(k), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]));
    return keyCache.get(k);
  }
  const aad = (appId, space, version) => te.encode(`th-sync/v${VERSION}|${appId}|${space}|${version}`);
  // envelope: [1 format][1 flags: 1 = gzip][12 IV][AES-GCM ciphertext+tag], base64
  async function seal(key, appId, space, version, text) {
    let data = te.encode(text), flags = 0;
    if (canZip()) { data = await pipe(data, CompressionStream, "gzip"); flags = 1; }
    const iv = rand(12);
    const ct = new Uint8Array(await subtle().encrypt({ name: "AES-GCM", iv, additionalData: aad(appId, space, version) }, await dataKey(key), data));
    return b64(cat(Uint8Array.of(VERSION, flags), iv, ct));
  }
  async function open(key, appId, space, version, ctB64) {
    const all = unb64(ctB64);
    if (all[0] !== VERSION) throw new Error("unknown format");
    const iv = all.subarray(2, 14), ct = all.subarray(14);
    let data = new Uint8Array(await subtle().decrypt({ name: "AES-GCM", iv, additionalData: aad(appId, space, version) }, await dataKey(key), ct));
    if (all[1] & 1) data = await pipe(data, DecompressionStream, "gzip");
    return td.decode(data);
  }

  /* Pairing with a 6-digit code – how strong is it, honestly?
     A 6-digit code has only 1,000,000 possibilities (~20 bits). Its safety comes from being ONLINE and SHORT-LIVED:
       - the server hands out each code's blob exactly once, deletes it after 10 minutes, and limits lookups to
         10 per minute (60 per hour) per IP address – an attacker guessing blindly has roughly a 1-in-10,000 chance
         per IP during the 10 minutes, and a successful guess "uses up" the code, so the real device sees
         "code didn't work" and the linking screen never says "Linked" – a visible warning sign;
       - PBKDF2 (600,000 rounds, random salt) only slows down someone who already holds the blob (e.g. whoever runs
         the server): trying all million codes then costs hours of GPU time, not years. It is NOT strong offline.
     So: fine for linking your own phone while you hold both devices, not a long-term secret.
     The QR code / link is the strong path: it carries the 256-bit keys in the URL #fragment, which browsers never
     send to any server – nothing guessable is involved at all. */
  async function codeKey(code, salt) {
    const base = await subtle().importKey("raw", te.encode(code), "PBKDF2", false, ["deriveKey"]);
    return subtle().deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: PBKDF2_ITER }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function pairSeal(code, appId, payload) {
    const salt = rand(16), iv = rand(12);
    const ct = new Uint8Array(await subtle().encrypt({ name: "AES-GCM", iv, additionalData: te.encode("th-pair/v1|" + appId) }, await codeKey(code, salt), te.encode(JSON.stringify(payload))));
    return b64(cat(Uint8Array.of(1), salt, iv, ct));
  }
  async function pairOpen(code, appId, blob) {
    const all = unb64(blob);
    if (all[0] !== 1) throw new Error("unknown format");
    const pt = await subtle().decrypt({ name: "AES-GCM", iv: all.subarray(17, 29), additionalData: te.encode("th-pair/v1|" + appId) }, await codeKey(code, all.subarray(1, 17)), all.subarray(29));
    return JSON.parse(td.decode(pt));
  }
  // link: <app url>#link=<appId>.<base64url([1][16 space][32 key][32 token])>
  function linkEncode(appId, s) { return appId + "." + b64url(cat(Uint8Array.of(1), unb64url(s.space), unb64url(s.key), unb64url(s.token))); }
  function linkDecode(str) {
    const m = /(?:#link=|^)([a-z0-9-]+)\.([A-Za-z0-9_-]{100,120})$/.exec(String(str || "").trim());
    if (!m) return null;
    const b = unb64url(m[2]);
    if (b.length !== 81 || b[0] !== 1) return null;
    return { app: m[1], space: b64url(b.subarray(1, 17)), key: b64url(b.subarray(17, 49)), token: b64url(b.subarray(49, 81)) };
  }

  // ------------------------------------------------------------------ QR code (byte mode, ECC M, versions 1–20)
  const QR = (() => {
    const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26];
    const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16];
    const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
    const rawMods = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
    const dataCw = v => Math.floor(rawMods(v) / 8) - ECC[v] * BLK[v];
    function rsDiv(d) { const r = new Array(d - 1).fill(0).concat([1]); let root = 1; for (let i = 0; i < d; i++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = mul(root, 2); } return r; }
    function rsRem(data, div) { const r = div.map(() => 0); for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); } return r; }
    function encode(text, forceMask) {
      const bytes = [...te.encode(text)];
      let v = 1; for (; v <= 20; v++) { if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= dataCw(v) * 8) break; }
      if (v > 20) throw new Error("too long for a QR code");
      const bits = [], put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
      put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
      const cap = dataCw(v) * 8;
      put(0, Math.min(4, cap - bits.length)); put(0, (8 - bits.length % 8) % 8);
      for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
      const data = []; for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => a << 1 | b, 0));
      // split into blocks, add error correction, interleave
      const nb = BLK[v], el = ECC[v], raw = Math.floor(rawMods(v) / 8), nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = rsDiv(el), blocks = [];
      for (let i = 0, k = 0; i < nb; i++) { const d = data.slice(k, k + shortLen - el + (i < nShort ? 0 : 1)); k += d.length; const e = rsRem(d, div); if (i < nShort) d.push(0); blocks.push(d.concat(e)); }
      const cw = []; for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - el || j >= nShort) cw.push(b[i]); });
      // draw
      const size = v * 4 + 17, M = [...Array(size)].map(() => new Array(size).fill(false)), F = [...Array(size)].map(() => new Array(size).fill(false));
      const set = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
      for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
      const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const x = cx + dx, y = cy + dy, dist = Math.max(Math.abs(dx), Math.abs(dy)); if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, dist !== 2 && dist !== 4); } };

 <div class="energy">${[0,1,2].map(l=>`<button class="en ${en===l?'on':''}" onclick="setEnergy(${l})">${bat(l)}${EL[l]}<small>${ES[l]}</small></button>`).join('')}</div></div>`;
 const two=[];
 if(p&&p.out){two.push(`<div class="card hero"><div class="kick" style="color:#fffc">TONIGHT</div><h2 style="font-size:26px;margin:4px 0 6px">Eating out or ordering in</h2><p class="mute" style="margin:0 0 14px">That's a plan too. Nothing gets wasted, the meal moved on.</p><button class="btn" onclick="clearDay('${k}')">Undo</button></div>`)}
 else if(r){const sb=startBy(r),now=new Date(),mins=Math.round((sb-now)/60000);
  const tooHard=en!==undefined&&en<r.e;
  two.push(`<div class="card hero"><div class="row" style="gap:14px"><div class="tile" style="background:#ffffff26;color:#fff">${ic(r.c)}</div><div><div class="kick" style="color:#fffc">TONIGHT'S DINNER</div><h2 style="font-size:24px">${esc(r.n)}</h2></div></div>
  <div class="startby">${ic('clock')}<div><div class="sm" style="opacity:.85">Start cooking by</div><b>${hm(sb)}</b></div><div style="margin-left:auto;text-align:right" class="sm">${p.done?'Done ✓':mins>0?`in ${mins>=60?Math.floor(mins/60)+' h ':''}${mins%60} min`:'Start now'}<br><span style="opacity:.8">${r.t} min · ${EL[r.e].toLowerCase()} energy</span></div></div>
  ${tooHard?`<p class="sm" style="margin:-4px 0 12px;background:#ffffff26;padding:9px 12px;border-radius:12px">This needs more energy than you have. Swap it with an easier one below, no guilt.</p>`:''}
  <div class="row" style="flex-wrap:wrap">${p.done?`<button class="btn" onclick="markDone('${k}',false)">${ic('check')} We ate it</button>`:`<button class="btn" onclick="cook('${r.id}','${k}')">${ic('play')} Cook step by step</button><button class="btn ghost" onclick="markDone('${k}',true)">${ic('check')} Ate it</button>`}<button class="btn ghost" onclick="plansChanged('${k}')">${ic('swap')} Plans changed</button></div></div>`)}
 else{two.push(`<div class="card hero"><div class="kick" style="color:#fffc">NOTHING PLANNED YET</div><h2 style="font-size:26px;margin:4px 0 6px">Stop staring at the fridge.</h2><p class="mute" style="margin:0 0 14px">Pick your energy above and choose from just 3 dinners. Never 30.</p><button class="btn" onclick="decide()">${ic('dice')} Pick 3 dinners for me</button></div>`)}
 // easier options
 const maxE=en!==undefined?en:(r?Math.max(0,r.e-1):1);
 const opts=choices(maxE,3,r?[r.id]:[]);
 let o=`<div class="card"><div class="row between"><h3>${r?'Not feeling it? Easier options':'Only 3 choices for your energy'}</h3><button class="btn s" onclick="render()">${ic('dice')} New 3</button></div><div style="margin-top:6px">`;
 o+=opts.map(x=>`<button class="opt" onclick="pickTonight('${x.id}')"><div class="tile">${ic(x.c)}</div><div class="grow"><b>${esc(x.n)}</b><span class="sm mute">${x.t} min · ${reasonFor(x,maxE===0)}</span></div>${ic('chev')}</button>`).join('');
 o+='</div></div>';
 // fridge
 const fr=[...S.fridge].sort((a,b)=>left(a)-left(b)).slice(0,3);
 let f=`<div class="card"><div class="row between"><h3>${ic('fridge')} Use it first</h3><button class="btn s" onclick="tab='list';render()">All</button></div>`;
 f+=fr.length?fr.map(fRow).join(''):`<p class="sm mute" style="margin:8px 0 0">Fresh food lands here when you tick it off your shopping list, so it doesn't rot at the back of the fridge.</p>`;f+='</div>';
 h+=`<div class="two"><div>${two.join('')}${o}</div><div>${f}${weekMini()}</div></div>`;
 return h}
function weekMini(){const s=weekStart(today());let n=0,c=0;for(let i=0;i<7;i++){const p=S.plan[iso(add(s,i))];if(p&&(p.r||p.out))n++;if(p&&p.done)c++}
 return `<div class="card"><h3>This week</h3><p class="sm mute" style="margin:4px 0 10px">${n} of 7 dinners planned · ${c} eaten at home</p><div class="row" style="gap:6px">${[0,1,2,3,4,5,6].map(i=>{const d=add(s,i),p=S.plan[iso(d)];const col=p&&p.done?'var(--a)':p&&(p.r||p.out)?'var(--a3)':'var(--line)';return `<div style="flex:1;text-align:center"><div style="height:8px;border-radius:4px;background:${col}"></div><div class="sm mute" style="margin-top:4px">${DN[d.getDay()][0]}</div></div>`}).join('')}</div><button class="btn s" style="margin-top:12px" onclick="tab='week';render()">Open week</button></div>`}
const left=f=>Math.round((new Date(f.added).getTime()+f.days*864e5-today().getTime())/864e5);
function fRow(f){const l=left(f);return `<div class="fr ${l<=1?'hot':''}"><div class="grow" style="flex:1"><b>${esc(f.n)}</b><div class="sm ${l<=1?'':'mute'}" style="${l<=1?'color:#7a2c1c;font-weight:600':''}">${l<0?'Past its best, check it':l===0?'Use today':l===1?'Use by tomorrow':l+' days left'}</div></div><button class="btn s" style="background:var(--card)" onclick="fUse('${f.id}',1)">Used</button><button class="btn s" style="background:var(--card)" onclick="fUse('${f.id}',0)">Tossed</button></div>`}

function vWeek(){
 window._wk=window._wk||0;const s=add(weekStart(today()),7*window._wk);const t=today();
 let h=`<div class="top"><div><div class="kick">${s.getDate()} ${MN[s.getMonth()]} – ${add(s,6).getDate()} ${MN[add(s,6).getMonth()]}</div><h1>${window._wk===0?'This week':window._wk===1?'Next week':'Week'}</h1></div><div class="row"><button class="iconbtn" onclick="_wk--;render()">${ic('back')}</button><button class="iconbtn" onclick="_wk++;render()">${ic('chev')}</button></div></div>`;
 h+=`<div class="row" style="margin-bottom:14px;flex-wrap:wrap"><button class="btn pri" onclick="doFill()">${ic('dice')} Fill my week</button><button class="btn" onclick="openLow()">${ic('bolt')} Low-energy days</button></div>`;
 h+='<div class="card">';
 for(let i=0;i<7;i++){const d=add(s,i),k=iso(d),p=S.plan[k],r=p&&p.r?rec(p.r):null;
  const past=d<t;
  h+=`<div class="day ${k===iso(t)?'today':''}"><div class="dl"><b>${DN[d.getDay()]}</b><span>${d.getDate()} ${MN[d.getMonth()]}</span></div>`;
  if(r)h+=`<button class="slot" onclick="dayMenu('${k}')"><div class="tile">${ic(r.c)}</div><div style="min-width:0;flex:1"><b style="display:block;font-size:15px">${esc(r.n)}</b><span class="sm mute">${r.t} min${isLow(d)?'<span class="lowtag">low-energy day</span>':''}</span></div>${p.done?`<span class="chip" title="eaten" style="padding:5px">${ic('check')}</span>`:''}</button>`;
  else if(p&&p.out)h+=`<button class="slot" onclick="dayMenu('${k}')"><div class="tile" style="background:var(--sun2);color:#6b4b00">${ic('out')}</div><b style="font-size:15px">Eat out or order in</b></button>`;
  else h+=`<button class="slot empty" onclick="dayMenu('${k}')">${past?'Nothing logged, that\'s okay':ic('plus')+' Add dinner'}${isLow(d)&&!past?'<span class="lowtag">low-energy day</span>':''}</button>`;
  h+='</div>'}
 h+='</div><p class="sm mute" style="text-align:center">Skipped a day? It just stays empty. No streaks, no red marks.</p>';
 return h}

function vList(){
 window._nw=window._nw||false;const items=shopping(_nw);const lk=(_nw?'n':'c')+iso(weekStart(today()));S.list[lk]=S.list[lk]||[];const done=S.list[lk];
 let h=`<div class="top"><div><div class="kick">${_nw?'Next week':'From today to the end of this week'}</div><h1>Shopping list</h1></div><button class="btn s" onclick="_nw=!_nw;render()">${_nw?'This week':'Next week'}</button></div>`;
 h+=`<div class="card" style="padding:12px"><div class="row"><input id="addx" placeholder="Add anything: milk, dish soap…" onkeydown="if(event.key==='Enter')addExtra()"><button class="iconbtn" style="background:var(--a);color:#fff;flex:none" onclick="addExtra()">${ic('plus')}</button></div></div>`;
 h+='<div class="two"><div>';
 if(!items.length)h+=`<div class="card empty-note">Plan a few dinners and the list fills itself, sorted the way you walk the store.</div>`;
 [...AORDER,'x'].forEach(a=>{const g=items.filter(x=>x.a===a);if(!g.length)return;g.sort((x,y)=>x.n.localeCompare(y.n));
  h+=`<div class="card aisle"><div class="row between"><h3>${a==='x'?'Extras':AISLE[a]}</h3><span class="sm mute">${g.filter(x=>!done.includes(x.n)).length} left</span></div>`;
  h+=g.map(x=>{const dn=done.includes(x.n);return `<button class="it ${dn?'done':''}" style="width:100%;text-align:left" onclick="tick('${lk}','${esc(x.n).replace(/'/g,"\\'")}','${x.a}')"><span class="ck">${dn?ic('check'):''}</span><span class="nm"><b>${esc(x.n)}</b>${x.ex?'':`<small>${fmtQ(x.q,x.u)} · ${esc(x.for.join(', '))}</small>`}</span>${x.ex?`<span onclick="event.stopPropagation();delExtra('${x.ex}')" class="mute">${ic('x')}</span>`:''}</button>`}).join('')+'</div>'});
 h+=`</div><div><div class="card"><div class="row between"><h3>${ic('fridge')} Use it first</h3><button class="btn s" onclick="addFridge()">${ic('plus')} Add</button></div><p class="sm mute" style="margin:6px 0 0">Ticked fruit, veg, meat and dairy move here with a use-by countdown.</p>${[...S.fridge].sort((a,b)=>left(a)-left(b)).map(fRow).join('')}</div>
 <div class="card"><h3>Staples you always keep</h3><p class="sm mute" style="margin:6px 0 10px">Left off the list: ${STAPLE.join(', ')}, salt and pepper.</p></div></div></div>`;
 return h}

function vRecipes(){
 const F={all:'All',go:'♥ Go-tos',e0:'Barely any energy',e1:'Some energy',e2:'Feeling good',q:'15 min or less',mine:'Mine'};
 let rs=allR();
 if(recFilter==='go')rs=rs.filter(r=>S.go.includes(r.id));if(recFilter==='mine')rs=S.mine;
 if(recFilter[0]==='e')rs=rs.filter(r=>r.e==+recFilter[1]);if(recFilter==='q')rs=rs.filter(r=>r.t<=15);
 let h=`<div class="top"><div><div class="kick">${allR().length} in your kitchen</div><h1>Recipes</h1></div><button class="btn pri s" onclick="newRecipe()">${ic('plus')} Add</button></div>`;
 h+=`<div class="filters">${Object.keys(F).map(k=>`<button class="chip ${recFilter===k?'on':''}" onclick="recFilter='${k}';render()">${F[k]}</button>`).join('')}</div>`;
 h+=`<div class="grid">${rs.map(r=>`<button class="rc" onclick="showRecipe('${r.id}')"><div class="tile">${ic(r.c)}</div><div style="flex:1;min-width:0"><b style="display:block">${esc(r.n)}</b><span class="sm mute">${r.t} min · ${EL[r.e].toLowerCase()} energy</span></div>${S.go.includes(r.id)?`<span style="color:var(--a)">${ic('heart')}</span>`:''}</button>`).join('')||'<div class="empty-note">Nothing here yet.</div>'}</div>`;
 return h}

function vWins(){
 const t=today(),ws=weekStart(t);const weeks=[];
 for(let w=7;w>=0;w--){const s=add(ws,-7*w);let c=0,o=0;for(let i=0;i<7;i++){const p=S.plan[iso(add(s,i))];if(p&&p.done)c++;if(p&&p.out&&add(s,i)<=t)o++}weeks.push({s,c,o})}
 const m0=new Date(t.getFullYear(),t.getMonth(),1);let mc=0;for(let d=new Date(m0);d<=t;d=add(d,1)){const p=S.plan[iso(d)];if(p&&p.done)mc++}
 const saved=Math.round(mc*S.people*(S.takeout-S.home));
 const tot=S.used+S.tossed,rate=tot?Math.round(S.used/tot*100):0;
 let h=`<div class="top"><div><div class="kick">No streaks. Only wins.</div><h1>Your wins</h1></div></div>`;
 h+=`<div class="stats"><div class="stat"><b>${mc}</b><span>home dinners this month</span></div><div class="stat"><b>${S.cur}${saved}</b><span>saved vs. takeout</span></div><div class="stat"><b>${tot?rate+'%':'–'}</b><span>fresh food used up</span></div></div>`;
 const W=600,H=200,bw=44,gap=(W-40-8*bw)/7,mx=Math.max(7,...weeks.map(w=>w.c+w.o));
 let svg=`<svg viewBox="0 0 ${W} ${H+28}" style="width:100%;height:auto;display:block">`;
 [0,.5,1].forEach(f=>{const y=10+H-H*f*(mx/mx);svg+=`<line x1="30" x2="${W}" y1="${10+(H-10)*(1-f)}" y2="${10+(H-10)*(1-f)}" stroke="var(--line)"/><text x="0" y="${14+(H-10)*(1-f)}" font-size="12" fill="var(--mute)">${Math.round(mx*f)}</text>`});
 weeks.forEach((w,i)=>{const x=40+i*(bw+gap);const hc=(H-10)*w.c/mx,ho=(H-10)*w.o/mx;
  svg+=`<rect x="${x}" y="${H-hc}" width="${bw}" height="${hc}" rx="7" fill="var(--a)"/>`;
  if(ho)svg+=`<rect x="${x}" y="${H-hc-ho-(hc?3:0)}" width="${bw}" height="${ho}" rx="7" fill="var(--sun)"/>`;
  if(w.c)svg+=`<text x="${x+bw/2}" y="${H-hc+18}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${w.c}</text>`;
  svg+=`<text x="${x+bw/2}" y="${H+22}" text-anchor="middle" font-size="12" fill="var(--mute)">${i===7?'This wk':w.s.getDate()+' '+MN[w.s.getMonth()]}</text>`});
 svg+='</svg>';
 h+=`<div class="card"><h3>Dinners per week</h3><div class="legend"><span><i style="background:var(--a)"></i>Eaten at home</span><span><i style="background:var(--sun)"></i>Ate out / ordered</span></div><div style="margin-top:12px">${svg}</div></div>`;
 // energy chart
 const ec=[0,0,0];Object.keys(S.energy).forEach(k=>{if(new Date(k)>=add(t,-30))ec[S.energy[k]]++});const et=ec[0]+ec[1]+ec[2];
 h+=`<div class="card"><h3>Your energy at dinner time, last 30 days</h3><p class="sm mute" style="margin:4px 0 12px">Many low days? Mark those weekdays as low-energy in Week, and Fill my week gives them zero-effort dinners.</p>${[0,1,2].map(l=>`<div class="row" style="margin-top:8px"><span style="width:110px" class="sm">${EL[l]}</span><div style="flex:1;height:14px;background:var(--bg);border-radius:7px;overflow:hidden"><div style="height:100%;width:${et?ec[l]/et*100:0}%;background:${['var(--warn)','var(--sun)','var(--a)'][l]};border-radius:7px"></div></div><b class="sm" style="width:34px;text-align:right">${ec[l]}</b></div>`).join('')}</div>`;
 return h}

/* ---------- actions ---------- */
function setEnergy(l){S.energy[iso(today())]=l;save();render()}
function pickTonight(id){const k=iso(today());S.plan[k]={r:id};save();render();toast('Tonight is sorted')}
function decide(){const k=iso(today()),en=S.energy[k];const opts=choices(en!==undefined?en:1,3);
 sheet(`<h2>Pick one. That's it.</h2><p class="mute sm">Three dinners that fit your energy. Tap one and tonight is decided.</p>${opts.map(x=>`<button class="opt" onclick="pickTonight('${x.id}');closeSheet()"><div class="tile">${ic(x.c)}</div><div class="grow"><b>${esc(x.n)}</b><span class="sm mute">${x.t} min · ${reasonFor(x,en===0)}</span></div>${ic('chev')}</button>`).join('')}`)}
function markDone(k,v){S.plan[k].done=v;save();render();if(v)toast('Nice. That\'s a win.')}
function clearDay(k){delete S.plan[k];save();render()}
function plansChanged(k){const r=rec(S.plan[k].r);
 sheet(`<h2>Plans changed?</h2><p class="mute sm">${esc(r.n)} isn't lost. Pick what's happening instead.</p>
 <button class="opt" onclick="moveTomorrow('${k}')"><div class="tile">${ic('swap')}</div><div class="grow"><b>Move it to tomorrow</b><span class="sm mute">The rest of the week shifts one day</span></div>${ic('chev')}</button>
 <button class="opt" onclick="S.energy['${k}']=0;save();closeSheet();render()"><div class="tile">${ic('bolt')}</div><div class="grow"><b>Too tired: show zero-effort meals</b><span class="sm mute">Swap for something that takes no energy</span></div>${ic('chev')}</button>
 <button class="opt" onclick="setOut('${k}')"><div class="tile">${ic('out')}</div><div class="grow"><b>We're eating out or ordering in</b><span class="sm mute">That's fine. The meal moves to tomorrow</span></div>${ic('chev')}</button>`)}
function moveTomorrow(k,out){const d=new Date(k+'T00:00');let carry=S.plan[k];if(out)S.plan[k]={out:true};else delete S.plan[k];
 for(let i=1;i<14&&carry;i++){const kk=iso(add(d,i));const nx=S.plan[kk];if(nx&&nx.out){continue}S.plan[kk]={r:carry.r};carry=nx&&nx.r?nx:null}
 save();closeSheet();render();toast(out?'Enjoy. Tonight\'s meal moved to tomorrow':'Moved. The week bends, nothing breaks')}
function setOut(k){moveTomorrow(k,true)}
function dayMenu(k){const p=S.plan[k],d=new Date(k+'T00:00');const low=isLow(d);const opts=choices(low?0:1,3,p&&p.r?[p.r]:[]);
 sheet(`<h2>${DN[d.getDay()]} ${d.getDate()} ${MN[d.getMonth()]}</h2>${p&&p.r?`<div class="row" style="margin:12px 0;flex-wrap:wrap"><button class="btn s" onclick="showRecipe('${p.r}')">Open recipe</button><button class="btn s" onclick="S.plan['${k}'].done=!S.plan['${k}'].done;save();closeSheet();render()">${ic('check')} ${p.done?'Not eaten':'We ate it'}</button><button class="btn s ghost" onclick="clearDay('${k}');closeSheet()">${ic('trash')} Clear</button></div>`:''}
 <h3 style="margin-top:14px">${p&&p.r?'Swap for one of these':'Pick one of these'}</h3>${opts.map(x=>`<button class="opt" onclick="S.plan['${k}']={r:'${x.id}'};save();closeSheet();render()"><div class="tile">${ic(x.c)}</div><div class="grow"><b>${esc(x.n)}</b><span class="sm mute">${x.t} min · ${reasonFor(x,low)}</span></div>${ic('chev')}</button>`).join('')}
 <button class="opt" onclick="S.plan['${k}']={out:true};save();closeSheet();render()"><div class="tile" style="background:var(--sun2);color:#6b4b00">${ic('out')}</div><div class="grow"><b>Eat out or order in</b><span class="sm mute">Planned on purpose, no guilt</span></div></button>
 <button class="btn s ghost" style="margin-top:12px" onclick="tab='recipes';closeSheet();render()">Browse all recipes</button>`)}
function doFill(){const s=add(weekStart(today()),7*(window._wk||0));const f=fillWeek(s);
 if(!f.length){toast('Every day already has a plan');return}window._fill=f;
 sheet(`<h2>Fill my week</h2><p class="sm mute">Low-energy days get zero-effort dinners. Nothing is saved until you keep it.</p>${f.map((x,i)=>`<div class="opt"><div style="width:62px" class="sm"><b>${DN[x.d.getDay()]}</b>${x.d.getDate()} ${MN[x.d.getMonth()]}</div><div class="tile">${ic(x.r.c)}</div><div class="grow"><b>${esc(x.r.n)}</b><span class="why">${x.why}</span></div><button onclick="_fill.splice(${i},1);this.closest('.opt').remove()" class="mute">${ic('x')}</button></div>`).join('')}
 <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="closeSheet();doFill()">${ic('dice')} Shuffle</button><button class="btn pri" style="flex:1" onclick="_fill.forEach(x=>S.plan[x.k]={r:x.r.id});save();closeSheet();render();toast('Week planned')">${ic('check')} Keep ${f.length}</button></div>`)}
function openLow(){sheet(`<h2>Low-energy days</h2><p class="sm mute">Which days are you usually drained? Long work days, sports, late classes. These get zero-effort dinners when you fill your week.</p><div class="pick" style="margin-top:12px">${[1,2,3,4,5,6,0].map(d=>`<button class="${S.low.includes(d)?'on':''}" onclick="togLow(${d},this)">${DN[d]}</button>`).join('')}</div><button class="btn pri big" style="margin-top:18px" onclick="closeSheet();render()">Done</button>`)}
function togLow(d,el){S.low=S.low.includes(d)?S.low.filter(x=>x!==d):[...S.low,d];el.classList.toggle('on');save()}
function tick(lk,n,a){const l=S.list[lk];const i=l.indexOf(n);if(i>=0){l.splice(i,1)}else{l.push(n);if(SHELF[a]&&!S.fridge.some(f=>f.n===n)){S.fridge.push({id:'f'+Date.now(),n,added:iso(today()),days:SHELF[a]})}}save();render()}
function addExtra(){const v=$('#addx').value.trim();if(!v)return;S.extra.push({id:'x'+Date.now(),n:v});save();render();$('#addx').focus()}
function delExtra(id){S.extra=S.extra.filter(x=>x.id!==id);save();render()}
function fUse(id,u){S.fridge=S.fridge.filter(f=>f.id!==id);u?S.used++:S.tossed++;save();render()}
function addFridge(){sheet(`<h2>Add to fridge</h2><label class="f">What is it?</label><input id="fn" placeholder="e.g. Chicken, spinach"><label class="f">Use within</label><div class="pick" id="fd">${[1,2,3,5,7].map(d=>`<button class="${d===3?'on':''}" onclick="[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">${d} day${d>1?'s':''}</button>`).join('')}</div><button class="btn pri big" style="margin-top:18px" onclick="const n=$('#fn').value.trim();if(!n)return;S.fridge.push({id:'f'+Date.now(),n,added:iso(today()),days:parseInt($('#fd .on').textContent)});save();closeSheet();render()">Add</button>`)}
function showRecipe(id){const r=rec(id);window._srv=S.people;
 const body=()=>`<div class="row" style="gap:14px"><div class="tile">${ic(r.c)}</div><div style="flex:1"><h2>${esc(r.n)}</h2><span class="sm mute">${r.t} min · ${EL[r.e].toLowerCase()} energy</span></div></div>
 <div class="row" style="margin:14px 0;flex-wrap:wrap"><button class="btn pri" onclick="closeSheet();cook('${r.id}')">${ic('play')} Cook</button><button class="btn" onclick="togGo('${r.id}')">${ic('heart')} ${S.go.includes(r.id)?'Go-to ✓':'Make it a go-to'}</button>${r.id[0]==='m'?`<button class="btn ghost" onclick="delRecipe('${r.id}')">${ic('trash')}</button>`:''}</div>
 <div class="row between"><h3>Ingredients</h3><div class="row"><button class="iconbtn" style="width:34px;height:34px" onclick="_srv=Math.max(1,_srv-1);document.getElementById('rb').innerHTML=ingHtml()">–</button><b class="sm">${'<span id="sv"></span>'}</b><button class="iconbtn" style="width:34px;height:34px" onclick="_srv++;document.getElementById('rb').innerHTML=ingHtml()">+</button></div></div><div id="rb"></div>
 <h3 style="margin-top:16px">Steps</h3><ol style="padding-left:20px;margin:8px 0">${r.s.map(x=>`<li style="margin-bottom:6px">${esc(x.replace(/\s*\{\d+\}/,''))}</li>`).join('')}</ol>`;
 window.ingHtml=()=>`<p class="sm mute" style="margin:6px 0">${_srv} serving${_srv>1?'s':''}</p>`+r.i.map(x=>{const g=parseIng(x);return `<div class="it" style="padding:8px 0"><span class="nm">${fmtQ(g.q*_srv/2,g.u)} ${esc(g.n)}</span></div>`}).join('');
 sheet(body());document.getElementById('rb').innerHTML=ingHtml()}
function togGo(id){S.go=S.go.includes(id)?S.go.filter(x=>x!==id):[...S.go,id];save();closeSheet();render();showRecipe(id)}
function delRecipe(id){S.mine=S.mine.filter(r=>r.id!==id);save();closeSheet();render()}
function newRecipe(){sheet(`<h2>Add your recipe</h2><label class="f">Name</label><input id="rn"><label class="f">Energy it needs</label><div class="pick" id="re">${EL.map((e,i)=>`<button class="${i===1?'on':''}" data-v="${i}" onclick="[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">${e}</button>`).join('')}</div><label class="f">Minutes</label><input id="rt" type="number" value="20"><label class="f">Ingredients for 2, one per line</label><textarea id="ri" rows="4" placeholder="200 g pasta&#10;1 pc onion&#10;1 can tomatoes"></textarea><label class="f">Steps, one per line</label><textarea id="rs" rows="4"></textarea><button class="btn pri big" style="margin-top:18px" onclick="saveRecipe()">Save</button>`)}
function saveRecipe(){const n=$('#rn').value.trim();if(!n)return toast('Give it a name');
 const ing=$('#ri').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^([\d.]+)\s*(g|ml|tbsp|tsp|pc|can|pack|bunch)?\s+(.+)$/);return m?`s:${m[1]} ${m[2]||'pc'} ${m[3]}`:`s:1 pc ${x}`});
 S.mine.push({id:'m'+Date.now(),n,e:+$('#re .on').dataset.v,t:+$('#rt').value||20,c:'bowl',i:ing,s:$('#rs').value.split('\n').map(x=>x.trim()).filter(Boolean)});save();closeSheet();recFilter='mine';tab='recipes';render();toast('Recipe saved')}
/* cook mode */
let CK=null,wl=null,tmr=null;
async function cook(id,k){CK={r:rec(id),i:0,k};try{wl=await navigator.wakeLock.request('screen')}catch(e){}drawCook()}
function drawCook(){let el=$('.cook');if(!el){el=document.createElement('div');el.className='cook';document.body.appendChild(el)}
 const r=CK.r,s=r.s[CK.i],m=s.match(/\{(\d+)\}/),txt=s.replace(/\s*\{\d+\}/,'');
 el.innerHTML=`<div class="row between" style="max-width:620px;margin:0 auto;width:100%"><button class="iconbtn" onclick="endCook()">${ic('x')}</button><div style="flex:1;margin-left:12px"><div class="sm mute">Step ${CK.i+1} of ${r.s.length} · screen stays on</div><b>${esc(r.n)}</b></div></div>
 <div style="max-width:620px;margin:0 auto;width:100%"><div class="prog">${r.s.map((_,i)=>`<i class="${i<=CK.i?'on':''}"></i>`).join('')}</div></div>
 <div class="stepx">${tmr?`<div class="timer" style="margin-bottom:22px"><span>${ic('clock')} <span id="tl"></span></span><button onclick="clearInterval(tmr.h);tmr=null;drawCook()">${ic('x')}</button></div>`:''}<p>${esc(txt)}</p>${m?`<button class="btn" onclick="startT(${m[1]})">${ic('clock')} Start ${m[1]} min timer</button>`:''}</div>
 <div class="row" style="max-width:620px;margin:0 auto;width:100%"><button class="btn ghost" ${CK.i?'':'disabled style="opacity:.4"'} onclick="CK.i--;drawCook()">${ic('back')} Back</button><button class="btn pri" style="flex:1" onclick="${CK.i<r.s.length-1?'CK.i++;drawCook()':'finishCook()'}">${CK.i<r.s.length-1?'Next':'Done, let\'s eat'} ${ic('chev')}</button></div>`;
 if(tmr)tickT()}
function startT(m){if(tmr)clearInterval(tmr.h);tmr={end:Date.now()+m*6e4};tmr.h=setInterval(tickT,1000);drawCook()}
function tickT(){const el=$('#tl');if(!el||!tmr)return;const s=Math.max(0,Math.round((tmr.end-Date.now())/1000));el.textContent=s?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} left`:'Time is up!';if(!s){clearInterval(tmr.h);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}}
function endCook(){if(tmr){clearInterval(tmr.h);tmr=null}try{wl&&wl.release()}catch(e){}$('.cook')&&$('.cook').remove();CK=null}
function finishCook(){const k=CK.k||iso(today());const id=CK.r.id;endCook();S.plan[k]={r:id,done:true};save();render();toast('Cooked! That\'s a win.')}
/* sheets */
function sheet(h){closeSheet();const o=document.createElement('div');o.className='ov';o.onclick=e=>{if(e.target===o)closeSheet()};o.innerHTML=`<div class="sheet"><button class="iconbtn x" onclick="closeSheet()">${ic('x')}</button>${h}</div>`;document.body.appendChild(o)}
function closeSheet(){document.querySelectorAll('.ov').forEach(o=>o.remove())}
const THEMES={sage:'#3f7d5c',blush:'#c0557a',lavender:'#6f5bb5',ocean:'#2f6f8f',terracotta:'#b4573a'};
function setupFields(){return `<label class="f">How many people eat dinner? *</label><div class="pick" id="pp">${[1,2,3,4,5,6].map(n=>`<button class="${S.people===n?'on':''}" onclick="S.people=${n};[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">${n}</button>`).join('')}</div>
 <label class="f">Usual dinner time *</label><input type="time" id="dt" value="${S.dinner}" onchange="S.dinner=this.value">
 <label class="f">Low-energy days (optional)</label><div class="pick">${[1,2,3,4,5,6,0].map(d=>`<button class="${S.low.includes(d)?'on':''}" onclick="togLow(${d},this)">${DN[d]}</button>`).join('')}</div>
 <label class="f">Colour</label><div class="row">${Object.keys(THEMES).map(t=>`<button class="sw ${S.theme===t?'on':''}" style="background:${THEMES[t]}" onclick="S.theme='${t}';document.documentElement.dataset.t=t;[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')"></button>`).join('')}</div>`}
function openSettings(){sheet(`<h2>Settings</h2>${setupFields()}
 <label class="f">Week starts on</label><div class="pick"><button class="${S.monday?'on':''}" onclick="S.monday=true;save();openSettings()">Monday</button><button class="${!S.monday?'on':''}" onclick="S.monday=false;save();openSettings()">Sunday</button></div>
 <label class="f">For your savings chart</label><div class="row"><input id="cu" value="${esc(S.cur)}" style="width:70px" onchange="S.cur=this.value"><input type="number" value="${S.takeout}" onchange="S.takeout=+this.value" title="Takeout per person"><input type="number" value="${S.home}" onchange="S.home=+this.value" title="Home meal per person"></div><p class="sm mute">Currency · takeout per person · home meal per person</p>
 ${window.SYNC?`<label class="f">Sync between your devices</label><div data-ths-section>${SYNC.sectionHTML()}</div>`:''}
 <div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn s" onclick="backup()">Save a backup</button><label class="btn s">Restore backup<input type="file" accept=".json" hidden onchange="restore(this)"></label><button class="btn s ghost" onclick="if(confirm('Delete everything and start over?')){S=fresh();save();closeSheet();render()}">Start over</button></div>
 <button class="btn pri big" style="margin-top:18px" onclick="save();closeSheet();render()">Done</button>`)}
function backup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meal-planner-backup-'+iso(today())+'.json';a.click()}
function restore(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign(fresh(),JSON.parse(t));save();closeSheet();render();toast('Backup restored')}catch(e){toast('That file is not a backup')}})}
/* render */
const TABS=[['tonight','Tonight','tonight'],['week','Week','week'],['list','List','list'],['recipes','Recipes','book'],['wins','Wins','wins']];
function render(){
 document.documentElement.dataset.t=S.theme;
 if(!S.setup){$('#root').innerHTML=`<div class="onb"><h1 style="font-size:36px;line-height:1.1">Dinner, decided<br>in 10 seconds.</h1><p class="mute">A meal planner that asks how much energy you have, then gives you 3 choices, not 30. Set up takes 20 seconds.</p><div class="card" style="margin-top:20px">${setupFields()}<button class="btn pri big" style="margin-top:20px" onclick="S.setup=true;save();render()">Let's eat</button>${window.SYNC?`<button class="btn ghost big" style="margin-top:10px" onclick="SYNC.openJoin()">Already use it on another device?</button>`:''}</div></div>`;return}
 const V={tonight:vTonight,week:vWeek,list:vList,recipes:vRecipes,wins:vWins}[tab]();
 $('#root').innerHTML=`<div class="app"><nav class="side"><div class="brand"><span class="tile" style="width:34px;height:34px;border-radius:10px">${ic('bowl')}</span>Meal Planner</div>${TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${ic(t[2])}${t[1]}</button>`).join('')}<div style="flex:1"></div>${pill()}<button onclick="openSettings()">${ic('gear')}Settings</button></nav><main>${DEMO?`<div class="card" style="background:var(--a2);border:0;padding:12px 16px"><div class="row between" style="flex-wrap:wrap"><span class="sm"><b>Free demo</b> · changes aren't saved</span><a class="btn pri s" style="text-decoration:none" href="https://www.etsy.com/shop/TrueHavenStudios" target="_blank">Get the full app</a></div></div>`:''}${V}</main></div>
 <nav class="bot">${TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)">${ic(t[2])}${t[1]}</button>`).join('')}</nav>`}
/* demo data for screenshots: ?demo */
if(DEMO){S=fresh();S.setup=true;S.people=2;S.low=[3];S.go=['b9','b19','b0','b11'];const t=today(),ws=weekStart(t);
 const ids=['b24','b19','b9','b8','b16','b27','b0'];ids.forEach((id,i)=>{const d=add(ws,i);S.plan[iso(d)]={r:id,done:d<t}});S.plan[iso(add(ws,5))]={out:true};
 for(let w=1;w<8;w++)for(let i=0;i<7;i++){const k=iso(add(ws,-7*w+i));const v=(w*7+i)%5;S.plan[k]=v===4?{out:true}:v===3?{}:{r:'b'+((w*3+i)%30),done:true}}
 S.fridge=[{id:'f1',n:'salmon fillets',added:iso(add(t,-1)),days:2},{id:'f2',n:'spinach',added:iso(add(t,-3)),days:5},{id:'f3',n:'cherry tomatoes',added:iso(add(t,-1)),days:5}];
 S.used=14;S.tossed=3;for(let i=0;i<30;i++)S.energy[iso(add(t,-i))]=[1,0,2,1,0,1,2][i%7];S.energy[iso(t)]=1;
 S.list['n'+iso(ws)]=['broccoli','lemon','bagels'];['b19','b5','b13','b10','b11','b6'].forEach((id,i)=>{S.plan[iso(add(ws,7+i))]={r:id}});S.extra=[{id:'x1',n:'Dish soap'}];
 const q=new URLSearchParams(location.search);tab=q.get('tab')||'tonight';if(q.get('nw')){window._nw=true;window._wk=1}if(q.get('theme'))S.theme=q.get('theme');save=()=>{}}
render();
let _lk=null;
if(window.THSync){window.SYNC=THSync.create({appId:'meal',appName:'Meal Planner',storageKey:KEY,url:window.BP_SYNC_URL||'',demo:DEMO,
 getState:()=>{let x=null;try{x=localStorage.getItem(KEY)}catch(e){}return x||JSON.stringify(S)},
 applyState:j=>{S=Object.assign(fresh(),JSON.parse(j));try{localStorage.setItem(KEY,j)}catch(e){}closeSheet();render()},
 validate:j=>{const d=JSON.parse(j);if(typeof d!=='object'||!('plan' in d))throw new Error('not meal data')},
 describe:j=>{const d=JSON.parse(j);return Object.keys(d.plan||{}).length+' planned days · '+((d.mine||[]).length)+' own recipes'},
 hasData:()=>!!(S.setup&&Object.keys(S.plan).length),toast:m=>toast(m),
 onStatus:()=>{const f=()=>{const l=SYNC.linked;if(_lk!==null&&l!==_lk)render();_lk=l};f();setTimeout(f,700)},
 cls:{pri:'btn pri',ghost:'btn ghost',danger:'btn ghost'}});render();setTimeout(()=>SYNC.start(),0)}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
