    <div class="caps" style="margin:4px 0 2px">${q ? "Swap for one of these" : "Pick one – that's it"}${low ? " · low-energy day" : ""}</div>
    <div class="list">${frz.map(z => `<div class="item click" data-act="useFrz" data-id="${z.id}" data-d="${d}"><div class="emo" style="color:var(--b)">${ic("snow")}</div><div class="grow"><div class="nm">${esc(z.n)}</div><div class="tiny muted">From the freezer · ${plural(z.portions, "portion")} left</div></div>${ic("right")}</div>`).join("")}${opts.map(x => optRow(x, d, low, "pick", slot)).join("")}
    ${slot === "dinner" ? `<div class="item click" data-act="setOut" data-d="${d}"><div class="emo" style="color:var(--b)">${ic("out")}</div><div class="grow"><div class="nm">Eat out or order in</div><div class="tiny muted">Planned on purpose, no guilt</div></div>${ic("right")}</div>` : ""}</div>
    <div class="row sb mt"><button class="btn sm" data-act="dayMenu" data-d="${d}" data-slot="${slot}">${ic("dice")}3 others</button><button class="btn sm" data-act="pickFromAll" data-d="${d}" data-slot="${slot}">${ic("book")}Choose from all recipes</button></div>`);
}
function pickFromAll(d, slot) {
  const rs = MP.recipes(S).filter(r => r.slot === slot || slot === "dinner" && r.slot === "dinner").sort((a, b) => a.e - b.e || a.n.localeCompare(b.n));
  modal(`Pick a recipe · ${dshort(d)}`, `<input class="inp" id="pq" placeholder="Search" autocomplete="off" style="margin-bottom:8px"><div class="list" id="pl">${rs.map(r => `<div class="item click" data-act="pick" data-id="${r.id}" data-d="${d}" data-slot="${slot}" data-name="${esc(r.n.toLowerCase())}">${rIcon(r)}<div class="grow"><div class="nm">${esc(r.n)}</div><div class="tiny muted">${r.t} min · ${ENERGY[r.e][0].toLowerCase()} energy</div></div>${meter(r.e)}</div>`).join("")}</div>`);
}
function decide() {
  const t = today(), en = S.energy[t];
  modal("Decide tonight for me", `<p class="muted" style="margin-top:0">How much energy do you have right now?</p><div class="energy">${ENERGY.map(([n, s], l) => `<button class="${en === l ? "on" : ""}" data-act="energyDecide" data-v="${l}">${meter(l)}<b>${n}</b><span>${s}</span></button>`).join("")}</div>
    ${en !== undefined ? `<div class="caps" style="margin:16px 0 2px">Pick one. That's it.</div><div class="list">${S.freezer.filter(z => z.portions > 0 && en === 0).slice(0, 1).map(z => `<div class="item click" data-act="useFrz" data-id="${z.id}" data-d="${t}"><div class="emo" style="color:var(--b)">${ic("snow")}</div><div class="grow"><div class="nm">${esc(z.n)}</div><div class="tiny muted">From the freezer · just heat it</div></div>${ic("right")}</div>`).join("")}${MP.choices(S, t, en, en === 0 && S.freezer.some(z => z.portions > 0) ? 2 : 3).map(x => optRow(x, t, en === 0)).join("")}</div>` : ""}`);
}
function changed(d) {
  const p = MP.slot(S, d), q = slotName(p);
  modal("Plans changed?", `<p class="muted" style="margin-top:0">${q ? `<b>${esc(q.n)}</b> isn't lost. ` : ""}What's happening instead?</p><div class="list">
    <div class="item click" data-act="shift" data-d="${d}"><div class="emo">${ic("swap")}</div><div class="grow"><div class="nm">Move it to tomorrow</div><div class="tiny muted">The rest of the week shifts one day – fresh food goes first</div></div>${ic("right")}</div>
    <div class="item click" data-act="tooTired" data-d="${d}"><div class="emo">${ic("bolt")}</div><div class="grow"><div class="nm">Too tired – show me zero-effort meals</div><div class="tiny muted">No-cook, one tray or the freezer</div></div>${ic("right")}</div>
    <div class="item click" data-act="shiftOut" data-d="${d}"><div class="emo">${ic("out")}</div><div class="grow"><div class="nm">We're eating out or ordering in</div><div class="tiny muted">That's fine. The meal moves to tomorrow</div></div>${ic("right")}</div>
    <div class="item click" data-act="skipDay" data-d="${d}"><div class="emo">${ic("x")}</div><div class="grow"><div class="nm">Just skip it</div><div class="tiny muted">Everyone's out, or no one's hungry</div></div>${ic("right")}</div></div>`);
}
// move a dinner forward one day and push the rest along until a free day; leftovers & eat-out stay put
function shift(d, out) {
  let carry = MP.slot(S, d); setSlot(d, "dinner", out ? { out: true } : null);
  for (let i = 1; i < 21 && carry; i++) {
    const dd = E.addDays(d, i), nx = MP.slot(S, dd);
    if (nx && (nx.out || nx.frz || nx.left)) continue;
    setSlot(dd, "dinner", { r: carry.r, frz: carry.frz, n: carry.n, left: carry.left }); carry = nx && (nx.r) ? nx : null;
  }
}
// ------------------------------------------------------------ recipe detail & cook mode
let SRV = 2;
function recipeModal(id) {
  const r = MP.rec(S, id); if (!r) return; SRV = Math.max(1, Math.round(MP.portions(S)));
  const mine = r.id[0] === "m";
  modal(esc(r.n), `<div class="row wrap" style="gap:6px;margin-bottom:12px"><span class="badge">${r.t} min</span><span class="badge b">${meter(r.e)} ${ENERGY[r.e][0]} energy</span>${r.tags.includes("v") ? `<span class="badge">vegetarian</span>` : ""}${r.tags.includes("k") ? `<span class="badge">kids like it</span>` : ""}${r.tags.includes("f") ? `<span class="badge">freezes well</span>` : ""}</div>
    <div class="row wrap" style="gap:6px"><button class="btn sm pri" data-act="cook" data-id="${r.id}">${ic("play")}Cook step by step</button><button class="btn sm" data-act="planRecipe" data-id="${r.id}">${ic("week")}Plan it</button><button class="btn sm" data-act="togGo" data-id="${r.id}">${ic("heart")}${S.go.includes(r.id) ? "Go-to ✓" : "Make it a go-to"}</button>${mine ? `<button class="btn sm" data-act="editRecipe" data-id="${r.id}">${ic("edit")}Edit</button>` : ""}</div>
    <div class="row sb mt"><div class="caps">Ingredients</div><div class="stepper"><button class="iconbtn" data-act="srv" data-v="-1" aria-label="Fewer">−</button><b id="srvN">${SRV}</b><button class="iconbtn" data-act="srv" data-v="1" aria-label="More">+</button></div></div><div id="ingL">${ingList(r)}</div>
    <div class="caps mt">Steps</div><ol class="steps2">${r.s.map(x => `<li>${esc(x.replace(/\s*\{\d+\}/, ""))}</li>`).join("")}</ol>`, mine ? `<button class="btn danger" data-act="delRecipe" data-id="${r.id}">${ic("trash")}Delete</button>` : (r.id[0] === "b" ? `<button class="btn" data-act="hideRecipe" data-id="${r.id}">Hide this recipe</button>` : ""), { wide: 560 });
  window._r = r;
}
const ingList = r => `<p class="tiny muted" style="margin:4px 0">${plural(SRV, "portion")}</p><div class="list">${r.i.map(x => { const g = parseIng(x); return `<div class="item" style="padding:7px 0"><span class="num" style="width:74px;flex:none">${fmtQ(g.q * SRV / 2, g.u)}</span><span class="grow">${esc(g.n)}</span></div>`; }).join("")}</div>`;
let CK = null, WL = null, TMR = null;
async function cook(id, d, slot = "dinner") { closeModal(); CK = { r: MP.rec(S, id), i: 0, d: d || today(), slot }; try { WL = await navigator.wakeLock.request("screen"); } catch (e) { } drawCook(); }
function drawCook() {
  let el = $(".cookv"); if (!el) { el = document.createElement("div"); el.className = "cookv"; document.body.appendChild(el); }
  const r = CK.r, s = r.s[CK.i], m = s.match(/\{(\d+)\}/), txt = s.replace(/\s*\{\d+\}/, ""), last = CK.i === r.s.length - 1;
  el.innerHTML = `<div class="ckin"><div class="row sb"><div><div class="caps">Step ${CK.i + 1} of ${r.s.length} · the screen stays on</div><b class="serif" style="font-size:1.3em">${esc(r.n)}</b></div><button class="iconbtn" data-act="endCook" aria-label="Close">${ic("x")}</button></div>
    <div class="prog">${r.s.map((_, i) => `<i class="${i <= CK.i ? "on" : ""}"></i>`).join("")}</div>
    <div class="ckstep">${TMR ? `<div class="timer"><span>${ic("clock", "i16")} <span id="tl"></span></span><button class="iconbtn" data-act="stopT" aria-label="Stop timer">${ic("x")}</button></div>` : ""}<p>${esc(txt)}</p>${m ? `<button class="btn" data-act="startT" data-v="${m[1]}">${ic("clock")}Start ${m[1]} min timer</button>` : ""}
    ${CK.i === 0 ? `<details class="ckings"><summary>Ingredients for ${plural(MP.portions(S, CK.d), "portion")}</summary>${r.i.map(x => { const g = parseIng(x); return `<div>${fmtQ(g.q * MP.portions(S, CK.d) / 2, g.u)} ${esc(g.n)}</div>`; }).join("")}</details>` : ""}</div>
    <div class="row" style="gap:10px"><button class="btn" ${CK.i ? "" : "disabled"} data-act="ckBack">${ic("left")}Back</button><button class="btn pri big" style="flex:1;justify-content:center" data-act="${last ? "ckDone" : "ckNext"}">${last ? "Done – let's eat" : "Next"} ${ic("right")}</button></div></div>`;
  if (TMR) tickT();
}
function tickT() { const el = $("#tl"); if (!el || !TMR) return; const s = Math.max(0, Math.round((TMR.end - Date.now()) / 1000)); el.textContent = s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} left` : "Time's up!"; if (!s) { clearInterval(TMR.h); TMR.h = 0; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) { } } }
function endCook() { if (TMR) clearInterval(TMR.h); TMR = null; try { WL && WL.release(); } catch (e) { } WL = null; const el = $(".cookv"); if (el) el.remove(); }
function ckDone() {
  const r = CK.r, d = CK.d, slot = CK.slot; endCook();
  commit(() => { const p = MP.slot(S, d, slot); setSlot(d, slot, p && p.r === r.id ? { ...p, done: true } : { r: r.id, done: true }); }, "cooked");
  modal("Nice. That's a win.", `<p style="margin-top:0">Any portions left over? Put them in the freezer for a no-energy night, or eat them tomorrow.</p><div class="row sb"><span>Portions left</span><div class="stepper"><button class="iconbtn" data-act="lo" data-v="-1">−</button><b id="loN">0</b><button class="iconbtn" data-act="lo" data-v="1">+</button></div></div>`,
    `<button class="btn" data-act="close">None left</button><button class="btn" data-act="loSave" data-v="tomorrow" data-id="${r.id}">Tomorrow's lunch</button><button class="btn pri" data-act="loSave" data-v="freezer" data-id="${r.id}">${ic("snow")}Freeze them</button>`);
}

}
function guessAisle(n) {
  n = n.toLowerCase();
  if (/frozen/.test(n)) return "f";
  if (/chicken|beef|pork|mince|salmon|fish|shrimp|bacon|sausage|ham|turkey|lamb|tuna steak/.test(n)) return "m";

const normQ = (q, u) => u === "kg" ? [q * 1000, "g"] : u === "l" ? [q * 1000, "ml"] : [q, u || "pc"];

// what's at home for one ingredient: known amount in the same unit, or "some"
function haveOf(n, u) {

const capF = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const pDays = p => p.exp ? E.diff(today(), p.exp) : 99;

// ---------------------------------------------------------- planner logic, now aware of the kitchen
MP.usesFridge = (S, r) => (S.pantry || []).filter(p => p.exp && pDays(p) <= 2 && r.i.some(x => sameFood(parseIng(x).n, p.n)));
MP.coverage = (S, r) => {

  const miss = need.filter(g => !pantryFor(g.n).length);

MP.reason = (S, r, d, low) => {

  if (f.length) w.push("uses up " + f.slice(0, 2).map(x => x.n.toLowerCase()).join(" & "));

MP.choices = (S, d, maxE, n = 3, exclude = [], slot = "dinner") => {

  return MP.recipes(S).filter(r => r.slot === slot && r.e <= maxE && !exclude.includes(r.id) && MP.okFor(S, r, d))
    .map(r => ({ r, s: Math.random() * .9 + ((S.go || []).includes(r.id) ? 1.1 : 0) + MP.usesFridge(S, r).length * 1.4 + (hasP ? MP.coverage(S, r).p * 2.6 : 0) - (rc.has(r.id) ? 2.5 : 0) + (r.e === maxE ? .3 : 0) }))
    .sort((a, b) => b.s - a.s).slice(0, n).map(x => x.r);
};
MP.fromHome = (S, n = 3) => MP.recipes(S).filter(r => r.slot === "dinner" && MP.okFor(S, r, today())).map(r => ({ r, c: MP.coverage(S, r) }))
  .filter(x => x.c.p >= .5).sort((a, b) => b.c.p - a.c.p || MP.usesFridge(S, b.r).length - MP.usesFridge(S, a.r).length || a.r.e - b.r.e).slice(0, n);
const _shopping = MP.shopping;
const CNT = u => !["g", "ml", "kg", "l", "tbsp", "tsp"].includes(u);

MP.weekSpent = (S, d = today()) => { const s = E.weekStart(d, S.settings.weekStart), e = E.addDays(s, 6); return E.sum((S.spend || []).filter(x => x.kind === "groc" && x.date >= s && x.date <= e), x => x.amount); };

// ---------------------------------------------------------- add things to the kitchen

// ---------------------------------------------------------- shopping trip: ticked items -> kitchen, money -> budget
function listItems() {
  const [from, to, key] = listRange(), done = S.list[key] || [], items = MP.shopping(S, from, to).filter(x => x.home !== "all");
  S.extra.forEach(x => items.push({ n: x.n, u: "pc", a: "x", q: 0, ex: x.id }));

}
const tickedItems = () => listItems().filter(x => x.on);
const defQ = x => x.q ? (x.u === "g" || x.u === "ml" ? Math.round(x.q) : x.u === "tbsp" || x.u === "tsp" ? "" : Math.ceil(x.q - .01)) : "";

const wkOf = d => E.weekStart(d, S.settings.weekStart);
MP.budget = (S, ws) => S.settings.groc ? E.r2(S.settings.groc + ((S.carry || {})[ws] || 0)) : 0;

// last week ended with money left and nobody decided yet -> offer to add it to this week
MP.carryOffer = S => {

function saveTrip() {

  if (!its.length && !(a > 0)) return bad("Tick what you bought or type what you paid.");

// ---------------------------------------------------------- after cooking: take out what you used

  return card(`Use it first`, show.length ? `<div class="list">${show.map(row).join("")}</div>` : `<div class="empty">Fresh food lands here with a countdown when you finish a shopping trip – so nothing rots at the back of the fridge.</div>`,
    { right: n ? `<button class="lnk" data-go="kitchen">Kitchen</button>` : `<button class="lnk" data-act="addFridge">${ic("plus", "i16")} Add</button>`, tight: true, b: true });
}
function vKitchen() {
  const t = today(), P = S.pantry || [];
  const frz = card("Freezer shelf", S.freezer.filter(z => z.portions > 0).length ? `<div class="list">${[...S.freezer].filter(z => z.portions > 0).sort((a, b) => a.date < b.date ? -1 : 1).map(z => { const age = E.diff(z.date, t), old = age > 90; return `<div class="item"><div class="emo" style="color:var(--b)">${ic("snow")}</div><div class="grow"><div class="nm">${esc(z.n)}</div><div class="tiny ${old ? "badc" : "muted"}">${plural(z.portions, "portion")} · frozen ${age < 14 ? age + " days" : Math.round(age / 7) + " weeks"} ago${old ? " · best eaten soon" : ""}</div>
    <div class="row wrap" style="gap:5px;margin-top:7px"><button class="btn sm" data-act="useFrz" data-id="${z.id}" data-d="${t}">Tonight</button><button class="btn sm" data-act="useFrz" data-id="${z.id}" data-d="${E.addDays(t, 1)}">Tomorrow</button><button class="btn sm" data-act="frzPick" data-id="${z.id}">Another day</button><button class="btn sm" data-act="frzMinus" data-id="${z.id}">−1 portion</button></div></div></div>`; }).join("")}</div>` :
    `<div class="empty">Nothing in the freezer yet. After cooking, the app asks if there are portions left over – they land here, ready for a no-energy night.</div>`, { right: `<button class="lnk" data-act="addFrz">${ic("plus", "i16")} Add</button>`, tight: true });
  const groups = AORDER.map(a => { const g = P.filter(p => (p.a || "x") === a).sort((x, y) => x.n.localeCompare(y.n)); if (!g.length) return "";
    return `<div class="caps" style="margin:12px 0 4px">${AISLE[a]}</div>` + g.map(p => `<div class="item click" data-act="pEdit" data-id="${p.id}"><div class="grow"><div class="nm">${esc(p.n)}</div><div class="tiny muted">${p.q != null ? fmtQ(+p.q, p.u) : "some"}${p.exp ? ` · ${pDays(p) <= 1 ? `<span class="badc">use ${pDays(p) <= 0 ? "today" : "by tomorrow"}</span>` : pDays(p) + " days left"}` : ""}</div></div><button class="iconbtn" data-act="fUse" data-id="${p.id}" data-v="used" title="Used up" aria-label="Used up">${ic("check")}</button></div>`).join(""); }).join("");
  const home = card(`At home · ${P.length}`, P.length ? `<div class="list">${groups}</div><p class="help">Tap anything to change the amount. Cooking takes out what you used.</p>` : `<div class="empty">Empty for now. Finish a shopping trip and everything you ticked lands here – or add what's already in your cupboards.<br><button class="btn sm pri mt" data-act="addFridge">${ic("plus")}Add what's at home</button></div>`, { right: `<button class="lnk" data-act="addFridge">${ic("plus", "i16")} Add</button>`, tight: true });
  const top = head("What you have, what to cook", "Kitchen", `<button class="btn" data-act="addFridge">${ic("plus")}Add to kitchen</button><button class="btn pri" data-act="addFrz">${ic("snow")}Add to freezer</button>`, "Everything at home, what needs eating first, and dinners you can make right now.");
  const tot = S.used + S.tossed;
  const stats = `<div class="tiles" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px">${tile("At home", P.length, plural(P.length, "thing"))}${tile("Use soon", useSoon().length, "within a day", useSoon().length ? "bad" : "ok")}${tile("Freezer portions", E.sum(S.freezer, z => z.portions), "ready to heat")}${tile("Fresh food used", tot ? Math.round(S.used / tot * 100) + "%" : "–", `${S.used} used · ${S.tossed} tossed`, "ok")}</div>`;
  return top + stats + `<div class="grid g21 start"><div class="col">${fromHomeCard(4)}${home}</div><div class="col">${fridgeCard(0)}${frz}${boughtCard(8)}</div></div>`;
}

// ---------------------------------------------------------- actions (merged into ACT)
function kitchenActs(A) {
  const done0 = A.done;
  return {
    done: d => { done0(d); const p = MP.slot(S, d.d, d.slot || "dinner"); if (p && p.r && !p.frz && !p.left) usedModal(p.r, d.d); },
    addFridge: () => pantryForm(), pEdit: d => pantryForm((S.pantry || []).find(p => p.id === d.id)),
    pDel: d => { commit(() => { S.pantry = S.pantry.filter(p => p.id !== d.id); }, "remove"); closeModal(); toast("Removed.", () => undo()); },
    savePantry: d => { const n = val("pnm").trim(); if (!n) return bad("What is it?"); const q = num(val("pqq")), u = val("puu"), days = +($("#pdd .on") || { dataset: { v: 0 } }).dataset.v;
      commit(() => { const ex = d.id && S.pantry.find(p => p.id === d.id);
        if (ex) { Object.assign(ex, { n: capF(n.slice(0, 60)), q: q > 0 ? q : null, u, exp: days ? E.addDays(today(), days) : "" }); }
        else addPantry({ n, q: q > 0 ? q : null, u, a: guessAisle(n), days }, today()); }, "kitchen"); closeModal(); },
    fUse: d => { const f = (S.pantry || []).find(x => x.id === d.id); if (!f) return;
      commit(() => { S.pantry = S.pantry.filter(x => x !== f); if (d.v === "tossed") S.tossed++; else S.used++; if (d.v === "frozen") S.freezer.push({ id: uid(), n: f.n, portions: 1, date: today() }); }, d.v);
      toast(d.v === "tossed" ? "Gone. It happens." : d.v === "frozen" ? `${esc(f.n)} is in the freezer now.` : "Used up – nice.", () => undo()); },
    tick: d => { const [, , key] = listRange(); const l = S.list[key] = S.list[key] || []; const i = l.indexOf(d.n); commit(() => { if (i >= 0) l.splice(i, 1); else l.push(d.n); }); },
    store: () => { if (VS.store) return tripModal(); VS.store = true; render(); },
    logTrip: () => tripModal(),
    carryAdd: () => { const o = MP.carryOffer(S); if (!o) return; commit(() => { S.carry[o.ws] = E.r2((S.carry[o.ws] || 0) + o.left); S.carryDone[o.lw] = true; }, "carry over"); toast(`${fmt(o.left)} added to this week.`, () => undo()); },
    carryKeep: () => { const o = MP.carryOffer(S); if (!o) return; commit(() => { S.carryDone[o.lw] = true; S.savedGroc = E.r2((S.savedGroc || 0) + o.left); }, "keep saved"); toast(`${fmt(o.left)} kept as savings. Nice.`, () => undo()); }, logGroc: () => tripModal(), saveTrip: () => saveTrip(),
    uTog: (d, el) => el.classList.toggle("on"), usedSave: () => usedSave(), usedSkip: () => { const U = window._used; closeModal(); if (U && U.then) U.then(); },
    diet: d => { if (!S.setup && !DEMO) obCollect(); S.settings.diet = d.v; save(); render(); },
    rf: (d, el) => { VS.rf = d.v; if (el && el.dataset.go2 && route() !== el.dataset.go2) go(el.dataset.go2); else render(); }
  };
}

/* render loop, click/input wiring, actions */
const VIEWS = { home: vHome, week: vWeek, list: vList, recipes: vRecipes, month: vMonth, kitchen: vKitchen, household: vHousehold, insights: vInsights, settings: vSettings };
let lastRoute = null;
function render() {
  applyTheme();
  const root = $("#root");
  if (!S.setup && !DEMO) { root.innerHTML = vOnboard(); return; }
  const r = route(), y = scrollY, same = r === lastRoute;
  let html;
  try { html = VIEWS[r](); } catch (e) { console.error(e); html = `<div class="empty">Something went wrong on this page. Your data is safe – try another page or reload.<br><small>${esc(e.message)}</small></div>`; }
  root.innerHTML = shell(html);
  if (same) scrollTo(0, y); else scrollTo(0, 0);
  lastRoute = r;
  if (loadProblem) { toast(loadProblem); loadProblem = ""; }
}
addEventListener("hashchange", () => { closeModal(); render(); });
const wkStart = () => E.addDays(E.weekStart(today(), S.settings.weekStart), 7 * VS.wk);
const stepN = (id, dv, lo, hi) => { const el = $("#" + id); el.textContent = clamp(+el.textContent + +dv, lo, hi); };
const ACT = {

  quickAdd: () => quickAdd(), decide: () => decide(),

  reroll: () => render(), simple: d => { S.settings.simple = d.v === "1"; save(); render(); }, hideStart: () => { S.settings.hideStart = true; save(); render(); },
  pick: (d) => { const slot = d.slot || "dinner"; commit(() => setSlot(d.d, slot, { r: d.id }), "plan"); closeModal(); const r = MP.rec(S, d.id); toast(`${esc(r.n)} · ${i18day(d.d).toLowerCase() === "tonight" && slot === "dinner" ? "tonight is sorted" : "planned for " + i18day(d.d).toLowerCase()}.`, () => undo()); },
  useFrz: d => { const z = S.freezer.find(x => x.id === d.id); if (!z) return; commit(() => setSlot(d.d, "dinner", { frz: z.id, n: z.n, left: true, r: z.r }), "freezer meal"); closeModal(); toast(`${esc(z.n)} from the freezer · ${i18day(d.d).toLowerCase()}.${d.d !== today() ? " You'll get a reminder to take it out the night before." : ""}`, () => undo()); },
  dayMenu: d => dayMenu(d.d, d.slot || "dinner"), pickFromAll: d => pickFromAll(d.d, d.slot || "dinner"),
  done: d => { const slot = d.slot || "dinner"; const p = MP.slot(S, d.d, slot); if (!p) return;
    commit(() => { p.done = true; if (p.frz) { const z = S.freezer.find(x => x.id === p.frz); if (z) z.portions = Math.max(0, z.portions - Math.ceil(MP.portions(S, d.d))); } }, "eaten"); closeModal(); toast("Nice. That's a win.", () => undo()); },
  undone: d => { const p = MP.slot(S, d.d, d.slot || "dinner"); if (p) commit(() => { p.done = false; }, "undo eaten"); closeModal(); },
  clearSlot: d => { commit(() => setSlot(d.d, d.slot || "dinner", null), "clear"); closeModal(); toast("Cleared.", () => undo()); },
  changed: d => changed(d.d),
  shift: d => { commit(() => shift(d.d), "move"); closeModal(); toast("Moved to tomorrow. The week bends, nothing breaks.", () => undo()); },
  shiftOut: d => { commit(() => shift(d.d, true), "eat out"); closeModal(); moneyForm("take"); toast("Enjoy. The meal moved to tomorrow.", () => undo()); },
  tooTired: d => { S.energy[d.d] = 0; save(); closeModal(); render(); dayMenu(d.d); },
  skipDay: d => { commit(() => setSlot(d.d, "dinner", null), "skip"); closeModal(); toast("Skipped. No red marks.", () => undo()); },
  setOut: d => { commit(() => setSlot(d.d, "dinner", { out: true }), "eat out"); closeModal(); },
  logTake: () => moneyForm("take"), logGroc: () => moneyForm("groc"),
  saveMoney: d => { const a = num(val("ma")); if (!(a > 0)) return bad("Type the amount."); commit(() => S.spend.push({ id: uid(), date: val("md") || today(), amount: E.r2(a), kind: d.v }), "money"); closeModal(); toast("Saved.", () => undo()); },
  eat: d => { const t = today(); commit(() => { S.plan[t] = S.plan[t] || {}; const ids = S.plan[t].eat || S.people.map(p => p.id); S.plan[t].eat = ids.includes(d.id) ? ids.filter(x => x !== d.id) : [...ids, d.id]; }); },
  thawed: d => { const p = MP.slot(S, d.d); if (p) commit(() => { p.thawed = true; }); toast("Great – it'll be ready tomorrow."); },
  fUse: d => { const f = S.fridge.find(x => x.id === d.id); if (!f) return;
    commit(() => { S.fridge = S.fridge.filter(x => x !== f); if (d.v === "tossed") S.tossed++; else S.used++; if (d.v === "frozen") S.freezer.push({ id: uid(), n: f.n, portions: 1, date: today() }); }, d.v);
    toast(d.v === "tossed" ? "Gone. It happens." : d.v === "frozen" ? `${esc(f.n)} is in the freezer now.` : "Used up – nice.", () => undo()); },
  addFridge: () => fridgeForm(), one: (d, el) => { el.parentNode.querySelectorAll(".cat").forEach(b => b.classList.toggle("on", b === el)); },
  saveFridge: () => { const n = val("fn").trim(); if (!n) return bad("What is it?"); commit(() => S.fridge.push({ id: uid(), n: n.slice(0, 60), added: today(), days: +($("#fd .on") || { dataset: { v: 3 } }).dataset.v }), "fridge"); closeModal(); },
  addFrz: () => frzForm(), zp: d => stepN("zpN", d.v, 1, 30),
  saveFrz: () => { const n = val("zn").trim(); if (!n) return bad("What is it?"); commit(() => S.freezer.push({ id: uid(), n: n.slice(0, 60), portions: +$("#zpN").textContent, date: today() }), "freezer"); closeModal(); },
  frzPick: d => frzPick(d.id), frzMinus: d => { const z = S.freezer.find(x => x.id === d.id); if (z) commit(() => { z.portions = Math.max(0, z.portions - 1); if (!z.portions) S.freezer = S.freezer.filter(x => x !== z); }, "portion"); },
  fillWeek: () => { closeModal(); fillModal(route() === "week" ? wkStart() : E.weekStart(today(), S.settings.weekStart)); },
  fillNext: () => fillModal(E.addDays(E.weekStart(today(), S.settings.weekStart), 7)),
  fillDrop: d => { window._fill[+d.i] = null; const el = $(`#fillL [data-i="${d.i}"]`); if (el) el.remove(); },
  fillShuffle: d => fillModal(d.d),
  fillKeep: () => { const f = (window._fill || []).filter(Boolean); commit(() => f.forEach(x => setSlot(x.d, "dinner", x.out ? { out: true } : { r: x.r.id })), "fill week"); closeModal(); toast(`${plural(f.length, "day")} planned. Your shopping list is ready.`, () => undo()); },
  wPrev: () => { VS.wk--; render(); }, wNext: () => { VS.wk++; render(); },
  mPrev: () => { VS.month = E.ymAdd(curMonth(), -1); render(); }, mNext: () => { VS.month = E.ymAdd(curMonth(), 1); render(); },
  nw: d => { VS.nw = d.v === "1"; render(); }, store: () => { VS.store = !VS.store; render(); },
  tick: d => { const [, , key] = listRange(); const l = S.list[key] = S.list[key] || []; const i = l.indexOf(d.n);
    commit(() => { if (i >= 0) l.splice(i, 1); else { l.push(d.n); if (SHELF[d.a] && !S.fridge.some(f => f.n.toLowerCase() === d.n)) S.fridge.push({ id: uid(), n: d.n[0].toUpperCase() + d.n.slice(1), added: today(), days: SHELF[d.a] }); } }); },
  addExtra: () => { const v = val("addx").trim(); if (!v) return; commit(() => S.extra.push({ id: uid(), n: v.slice(0, 60) })); const n = $("#addx"); if (n) n.focus(); },
  delExtra: d => commit(() => { S.extra = S.extra.filter(x => x.id !== d.id); }),
  rf: d => { VS.rf = d.v; render(); }, recipe: d => recipeModal(d.id),
  srv: d => { SRV = clamp(SRV + +d.v, 1, 12); $("#srvN").textContent = SRV; $("#ingL").innerHTML = ingList(window._r); },
  togGo: d => { commit(() => { S.go = S.go.includes(d.id) ? S.go.filter(x => x !== d.id) : [...S.go, d.id]; }); recipeModal(d.id); },
  planRecipe: d => planRecipe(d.id), editRecipe: d => recipeForm(S.mine.find(r => r.id === d.id)),
  delRecipe: d => { commit(() => { S.mine = S.mine.filter(r => r.id !== d.id); }, "delete recipe"); closeModal(); toast("Recipe deleted.", () => undo()); },
  hideRecipe: d => { commit(() => S.hidden.push(d.id), "hide"); closeModal(); toast("Hidden – it won't be suggested any more.", () => undo()); },
  unhide: () => { commit(() => { S.hidden = []; }); toast("All recipes are back."); },
  newRecipe: () => recipeForm(null), saveRecipe: d => saveRecipe(d.id),
  seg: (d, el) => el.parentNode.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)),
  togCat: (d, el) => el.classList.toggle("on"), sw: (d, el) => el.classList.toggle("on"),
  cook: d => cook(d.id, d.d, d.slot || "dinner"), endCook: () => endCook(),
  ckNext: () => { CK.i++; drawCook(); }, ckBack: () => { CK.i = Math.max(0, CK.i - 1); drawCook(); }, ckDone: () => ckDone(),
  startT: d => { if (TMR) clearInterval(TMR.h); TMR = { end: Date.now() + +d.v * 6e4 }; TMR.h = setInterval(tickT, 1000); drawCook(); },
  stopT: () => { if (TMR) clearInterval(TMR.h); TMR = null; drawCook(); },
  lo: d => stepN("loN", d.v, 0, 12),
  loSave: d => { const n = +$("#loN").textContent; if (!n) return closeModal(); const r = MP.rec(S, d.id);
    commit(() => { if (d.v === "freezer") S.freezer.push({ id: uid(), n: r.n, r: r.id, portions: n, date: today() }); else { const tm = E.addDays(today(), 1); S.plan[tm] = S.plan[tm] || {}; if (!S.settings.slots.includes("lunch")) S.settings.slots.push("lunch"); S.plan[tm].lunch = { left: true, n: r.n + " (leftovers)", r: r.id }; } }, "leftovers");
    closeModal(); toast(d.v === "freezer" ? `${plural(n, "portion")} in the freezer – ready for a no-energy night.` : "Planned as tomorrow's lunch."); },
  editPerson: d => personForm(S.people.find(p => p.id === d.id)),
  savePerson: d => { const n = val("pn").trim(); if (!n) return bad("Type a name."); const p = { id: d.id || uid(), name: n.slice(0, 30), kid: $("#pk").classList.contains("on"), no: val("pno").split(",").map(x => x.trim()).filter(Boolean) };
    commit(() => { if (d.id) S.people = S.people.map(x => x.id === d.id ? p : x); else S.people.push(p); }, "person"); closeModal(); },
  delPerson: d => { commit(() => { S.people = S.people.filter(p => p.id !== d.id); }, "remove person"); closeModal(); toast("Removed.", () => undo()); },
  setLow: d => { commit(() => { S.settings.themes[d.v] = "low"; }); toast(`${DOWL[d.v]} is a low-energy day now.`); },
  slot: d => { if (d.v === "dinner") return; commit(() => { const s = S.settings.slots; S.settings.slots = s.includes(d.v) ? s.filter(x => x !== d.v) : [...s, d.v]; }); },
  backup: () => backup(), restore: () => { if (DEMO) return toast("This works in the full planner."); restore(); }, install: () => installApp(),
  resetAll: () => { modal("Start fresh?", `<p>This deletes everything in the planner on this device.${SYNC.linked ? " <b>Your linked devices are cleared too.</b> To clear only this one, unlink it in Settings first." : ""} Download a backup first if you might want it back.</p>`, `<button class="btn" data-act="backup">Download a backup</button><button class="btn danger" data-act="resetOk">Delete everything</button>`); },
  resetOk: () => { const th = S.settings.theme; S = blank(); S.settings.theme = th; OB = { step: 0, welcome: true, people: [{ name: "", kid: false }] }; flush(); closeModal(); go("home"); render(); },
  setTheme: d => { if (!S.setup && !DEMO) obCollect(); S.settings.theme = d.v; save(); render(); }, setDark: d => { S.settings.dark = d.v; save(); render(); },
  // onboarding
  obGo: () => { OB.welcome = false; render(); scrollTo(0, 0); },
  obSample: () => { const s = window.BP_SAMPLE(); s.settings.theme = S.settings.theme; S = migrate(s); S.setup = true; S.sample = true; save(); go("home"); render(); toast("This is example data – Settings › Start fresh clears it."); },
  obBack: () => { obCollect(); if (OB.step === 0) OB.welcome = true; else OB.step--; render(); },

  obAddP: () => { obCollect(); OB.people.push({ name: "", kid: false }); render(); const els = document.querySelectorAll("[data-obp]"); els[els.length - 1].focus(); },
  obDelP: d => { obCollect(); OB.people.splice(+d.i, 1); render(); },
  obLow: d => { obCollect(); const th = S.settings.themes; if (th[d.v] === "low") delete th[d.v]; else th[d.v] = "low"; render(); },
  obDone: () => { obCollect(); S.people = OB.people.filter(p => p.name.trim()).map(p => ({ id: uid(), name: p.name.trim().slice(0, 30), kid: p.kid, no: [] })); S.setup = true; save(); flush(); go("home"); render(); toast("You're set. Tap your energy and pick tonight's dinner."); }
};
Object.assign(ACT, kitchenActs(ACT));
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); closeModal(); go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a) { if (e.target.closest(".modal a.nav")) closeModal(); return; }
  const f = ACT[a.dataset.act]; if (!f) return;
  e.preventDefault(); f(a.dataset, a);
});
let qT = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "q") { clearTimeout(qT); qT = setTimeout(() => { VS.q = el.value; const pos = el.selectionStart; render(); const n = $("#q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 200); return; }
  if (el.id === "pq") { const q = el.value.toLowerCase(); document.querySelectorAll("#pl .item").forEach(it => it.classList.toggle("hidden", !it.dataset.name.includes(q))); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.set) { setSetting(el.dataset.set, el.value); render(); return; }
  if (el.dataset.themeDow) { commit(() => { if (el.value) S.settings.themes[el.dataset.themeDow] = el.value; else delete S.settings.themes[el.dataset.themeDow]; }); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "addx") { e.preventDefault(); ACT.addExtra(); } });
render();
