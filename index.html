:root{
  --bg:#F8F4F0;--bg2:#F1EBE5;--card:#FFFFFF;--ink:#2F2A27;--ink2:#6A615B;--ink3:#8C837C;
  --line:#EAE2DA;--line2:#DCD2C8;--shadow:0 1px 2px rgba(70,50,40,.05),0 10px 30px rgba(70,50,40,.06);
  --a:#94665F;--a1:#F4E6E3;--a2:#E7CDC8;--b:#5E7C64;--b1:#E5EEE6;--b2:#C9DDCC;
  --ok:#3F6E48;--okbg:#E0EDE2;--warn:#86601B;--warnbg:#F6EBD3;--bad:#A0412F;--badbg:#F6DFDA;
  --p1:#E7A1A6;--p2:#9DCBA6;--p3:#B5A3D8;--p4:#97BFE0;--p5:#E3C08E;--p6:#F0AE95;--p7:#8FCFC6;--p8:#D39CC4;--p9:#C2C08A;--p10:#A3B1C4;
  --r:20px;--fs:16px;--serif:"Bodoni",Georgia,"Times New Roman",serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[data-theme="Sage"]{--a:#5E7C64;--a1:#E5EEE6;--a2:#C9DDCC;--b:#94665F;--b1:#F4E6E3;--b2:#E7CDC8}
[data-theme="Lavender"]{--a:#76689A;--a1:#ECE7F4;--a2:#D6CCE8;--b:#4F7193;--b1:#E3ECF5;--b2:#C8D9EA}
[data-theme="Sky"]{--a:#4F7193;--a1:#E3ECF5;--a2:#C8D9EA;--b:#76689A;--b1:#ECE7F4;--b2:#D6CCE8}
[data-theme="Sand"]{--a:#8A6D4E;--a1:#F2E9DE;--a2:#E3D2BD;--b:#5E7C64;--b1:#E5EEE6;--b2:#C9DDCC}
[data-theme="Stone"]{--a:#6B635D;--a1:#EEEAE6;--a2:#DAD3CC;--b:#94665F;--b1:#F4E6E3;--b2:#E7CDC8}
[data-theme="Mocha"]{--a:#6F5146;--a1:#F1E6E0;--a2:#DDC8BE;--b:#A3603F;--b1:#F7E7DD;--b2:#ECCDB9}
[data-theme="Ocean"]{--a:#3F6B78;--a1:#E1EDF0;--a2:#C3DAE0;--b:#8A6D4E;--b1:#F2E9DE;--b2:#E3D2BD}
[data-theme="Plum"]{--a:#73465F;--a1:#F2E5EC;--a2:#E2C8D6;--b:#9A5F7E;--b1:#F6E8EF;--b2:#EBCFDD}
[data-theme="Noir"]{--a:#34302D;--a1:#ECE8E3;--a2:#D9D2C9;--b:#8C6F3A;--b1:#F4ECDC;--b2:#E6D5B2}
html[data-dark="1"]{
  --bg:#1B1918;--bg2:#24211F;--card:#2A2725;--ink:#F3EEEA;--ink2:#BDB4AD;--ink3:#8D847D;--line:#38332F;--line2:#4A443F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --ok:#9CC8A5;--okbg:#2B3A2E;--warn:#E3BA72;--warnbg:#3D3324;--bad:#EC9E8F;--badbg:#45302B;color-scheme:dark;
}
/* the theme sits on <body>; dark tints must be set there too or the light tints win */
html[data-dark="1"] body[data-theme],html[data-dark="1"]{--a1:color-mix(in srgb,var(--a) 30%,#2A2725);--a2:color-mix(in srgb,var(--a) 50%,#9A928B);--b1:color-mix(in srgb,var(--b) 30%,#2A2725);--b2:color-mix(in srgb,var(--b) 50%,#9A928B)}
html[data-dark="1"] body[data-theme="Noir"]{--a:#57504A}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.45}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:.01em}
h1{font-size:2.1em;line-height:1.08;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:1.3em;line-height:1.2}
h3{font-size:1.05em}
.caps{font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:.87em}.tiny{font-size:.77em}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.hidden{display:none!important}
.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}

/* ------------------------------------------------ layout */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:250px;flex:none;padding:24px 14px 20px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:1px}
.brand{padding:2px 12px 16px}
.brand .k{font-size:.62em;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.32em;display:block;line-height:1.1;margin-top:3px;letter-spacing:.02em}
.brand .arch{width:30px;height:34px;color:var(--a);margin-bottom:8px}
.navlabel{padding:14px 12px 5px;font-size:.64em}
.nav{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:11px;color:var(--ink);text-decoration:none;font-size:.94em;border:0;background:none;width:100%;text-align:left}
.nav svg{width:18px;height:18px;flex:none;color:var(--ink2)}
.nav:hover{background:var(--bg2)}
.nav.on{background:var(--a);color:#fff;font-weight:500}
.nav.on svg{color:#fff}
.nav .badge{margin-left:auto}
.side .addbtn{margin:2px 0 6px;justify-content:center}
.main{flex:1;min-width:0;padding:28px 36px 120px;max-width:1240px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar .sub{margin-top:5px}
.topbar .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.row.sb{justify-content:space-between}.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.tabbar{display:none}
.mt{margin-top:18px}.mt0{margin-top:0}

/* ------------------------------------------------ cards with a colored title band (our signature) */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);min-width:0;overflow:hidden}
.card>.band{background:var(--a);color:#fff;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.card>.band.b{background:var(--b)}
.card>.band.soft{background:var(--a1);color:var(--ink)}
.card>.band.softb{background:var(--b1);color:var(--ink)}
.band .t{font-size:.74em;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.band .r{font-size:.8em;opacity:.9;display:flex;gap:8px;align-items:center}
.band .lnk{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:20px;padding:4px 11px;font-size:.92em}
.band.soft .lnk,.band.softb .lnk{background:var(--card)}
.card>.body{padding:18px 20px}
.card>.body.tight{padding:8px 20px 12px}
.card.pad{padding:18px 20px}
.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
/* key number tiles (like the spreadsheet) */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);text-align:center;min-width:0;display:flex;flex-direction:column}
.tile>b{flex:1;display:flex!important;align-items:center;justify-content:center;padding:8px!important}
.grid.start{align-items:start}
.tiles{grid-auto-rows:1fr}
.tile .h{background:var(--a1);font-size:.66em;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:8px 6px;color:var(--ink)}
.tile:nth-child(even) .h{background:var(--b1)}
.tile b{display:block;font-family:var(--serif);font-weight:500;font-size:1.65em;padding:10px 8px 2px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:.78em;color:var(--ink2);padding:0 8px 11px}
.tile .s.ok{color:var(--ok)}.tile .s.bad{color:var(--bad)}

/* hero: safe to spend */
.hero{background:var(--b1);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--b2) 60%,transparent);text-align:center;display:flex;flex-direction:column}
.hero .band{background:var(--b);color:#fff;padding:11px 16px;font-size:.74em;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.hero .in{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-family:var(--serif);font-weight:500;font-size:3.9em;line-height:1;letter-spacing:-.01em;display:inline-flex;align-items:flex-start;gap:2px;font-variant-numeric:tabular-nums}
.big .cur{font-size:.4em;margin-top:.3em;opacity:.7}
.big .ct{font-size:.4em;margin-top:.3em;opacity:.7}
.big.neg{color:var(--bad)}
.hero .line{color:var(--b);font-weight:500;margin-top:8px;font-size:.98em}
html[data-dark="1"] .hero .line{color:var(--ink)}
.hero .math{margin-top:12px;background:var(--card);border-radius:14px;padding:9px 14px;font-size:.84em;width:100%;max-width:340px;text-align:left}
.hero .math div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.hero .math .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:500}
.hero .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--card);border-radius:30px;padding:9px 16px;font-size:.92em;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--a)}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.pri2{background:var(--b);border-color:var(--b);color:#fff}
.btn.soft{background:var(--a1);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:.84em}
.btn.danger{color:var(--bad)}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{border:0;background:none;width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:hover{background:var(--bg2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.link{border:0;background:none;padding:0;color:var(--a);text-decoration:underline;text-underline-offset:3px;font-size:.88em;cursor:pointer}
html[data-dark="1"] .link{color:var(--a2)}
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:max(11.5px,.74em);font-weight:500;background:var(--a1);color:var(--ink);white-space:nowrap}
.badge.b{background:var(--b1)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.seg{display:inline-flex;background:var(--bg2);border-radius:30px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:30px;padding:6px 13px;font-size:.86em;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.monthpick{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line2);border-radius:30px;padding:3px}
.monthpick b{font-weight:500;min-width:128px;text-align:center;font-size:.94em}
.monthpick .iconbtn{width:30px;height:30px;border-radius:50%}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.click{cursor:pointer}
.item.click:hover .nm{text-decoration:underline;text-underline-offset:3px}
.nm{font-weight:500}
.date{width:44px;flex:none;text-align:center;border-radius:11px;background:var(--bg2);padding:5px 0 4px;line-height:1.05}
.date b{display:block;font-family:var(--serif);font-weight:500;font-size:1.18em}
.date span{font-size:.6em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.date.a{background:var(--a1)}.date.b{background:var(--b1)}.date.ok{background:var(--okbg)}
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:var(--ok)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.emo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:1.05em;background:var(--bg2)}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1.5px dashed var(--line2);border-radius:14px;font-size:.92em}
.dayhead{font-size:.68em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:14px 0 4px;font-weight:500}
.dayhead:first-child{padding-top:0}
.tag{font-size:.72em;background:var(--b1);border-radius:10px;padding:1px 7px;margin-left:6px}
table.t{width:100%;border-collapse:collapse;font-size:.88em}
table.t th{font-size:.7em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:500;text-align:right;padding:8px 6px;background:var(--b1);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:500;border-top:2px solid var(--line2)}
table.t td.over{background:var(--badbg);color:var(--bad)}
table.t td.cur{background:var(--a1)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* progress */
.bar{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--b);transition:width .6s}
.bar.a i{background:var(--a)}
.bar.over i{background:var(--bad)}
.bar.thick{height:13px}
.bar.mark{position:relative;overflow:visible}
.bar.mark u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2);border-radius:2px}
.budrow{padding:11px 0;border-top:1px solid var(--line)}
.budrow:first-child{border-top:0}
.budrow .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;align-items:baseline}
.budrow .sub2{display:flex;justify-content:space-between;font-size:.78em;color:var(--ink2);margin-top:4px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:.8em;color:var(--ink2);font-weight:500}
.inp{width:100%;border:1.5px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 13px;outline:none;font-size:1em;min-width:0}
.inp:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 16%,transparent)}
.inp.sm{padding:6px 9px;font-size:.9em;border-radius:9px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help{font-size:.78em;color:var(--ink3)}
.switch{position:relative;width:44px;height:26px;border-radius:20px;background:var(--line2);border:0;padding:0;flex:none;transition:background .2s}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--b)}.switch.on:after{left:21px}
input[type=range]{width:100%;accent-color:var(--a)}
.erow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .e{width:54px;text-align:center;flex:none}.erow .n{flex:1 1 150px;min-width:0}.erow .a{width:100px;flex:none}.erow .g{width:110px;flex:none}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(40,30,25,.38);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s}
.modal{background:var(--card);border-radius:24px;width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .22s}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 12px;position:sticky;top:0;background:var(--card);z-index:2;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:1.2em}
.modal .mb{padding:16px 22px 18px}
.modal .mf{display:flex;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.modal .mf .btn{flex:1 1 auto;justify-content:center}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}

/* add sheet */
.kind{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:12px}
.kind button{border:0;background:none;border-radius:11px;padding:8px;font-weight:500;color:var(--ink2)}
.kind button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.amountview{text-align:center;padding:2px 0 6px}
.amountview input{border:0;background:none;text-align:center;font-family:var(--serif);font-size:2.8em;width:100%;outline:none;padding:0;font-variant-numeric:tabular-nums}
.plus{display:flex;gap:8px;justify-content:center;margin:2px 0 10px;flex-wrap:wrap}
.plus button{border:0;background:var(--a1);border-radius:30px;padding:6px 13px;font-weight:500;font-size:.86em}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 12px}
.cat{border:1.5px solid var(--line2);background:var(--card);border-radius:30px;padding:6px 12px;font-size:.86em;display:inline-flex;gap:6px;align-items:center}
.cat.on{border-color:var(--a);background:var(--a1);font-weight:500}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2F2A27;color:#fff;border-radius:16px;padding:11px 12px 11px 18px;display:flex;gap:14px;align-items:center;z-index:60;box-shadow:0 12px 34px rgba(0,0,0,.28);animation:pop .25s;max-width:calc(100vw - 28px);font-size:.92em}
.toast button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:20px;padding:6px 13px;font-weight:500}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.66em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-align:center;padding:4px 0;font-weight:500}
.cday{min-height:96px;border-radius:12px;background:var(--bg2);padding:6px 7px;display:flex;flex-direction:column;gap:3px;border:1.5px solid transparent;min-width:0;text-align:left}
.cday.out{opacity:.3}
.cday.today{border-color:var(--a);background:var(--card)}
.cday.ns{background:var(--b1)}
.cday .d{font-size:.8em;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.ev{font-size:.68em;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);border-left:3px solid var(--a)}
.ev.income{border-left-color:var(--ok);background:var(--okbg)}
.ev.sub{border-left-color:var(--p3)}.ev.debt{border-left-color:var(--bad)}.ev.save{border-left-color:var(--b)}
.ev.spend{border-left:0;background:transparent;padding-left:1px;color:var(--ink2)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini i{aspect-ratio:1;border-radius:4px;background:var(--bg2);font-style:normal;font-size:.56em;display:grid;place-items:center;color:var(--ink3)}
.mini i.ns{background:var(--b);color:#fff}.mini i.sp{background:var(--a1);color:var(--ink2)}.mini i.x{background:none}
.minis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 18px}
.minis h4{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:.95em;display:flex;justify-content:space-between}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--ink2);font-size:10.5px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.86em}
.legend div{display:flex;align-items:center;gap:9px}
.legend .v{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:500;flex:none;white-space:nowrap}
.legend .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78em;color:var(--ink2);margin-top:8px}
.hleg span{display:inline-flex;align-items:center;gap:6px}
.hleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donutwrap{display:flex;gap:16px;align-items:center}
.donutwrap .legend{flex:1;min-width:0}
.flow{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.flow i{display:block;height:100%;min-width:3px}
.tip{position:fixed;z-index:80;background:#2F2A27;color:#fff;font-size:12px;border-radius:8px;padding:5px 9px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-120%)}

/* goals */
.jar{width:44px;height:58px;flex:none}
.goal .bigsum{font-family:var(--serif);font-size:1.8em;line-height:1.1}
.bigdate{font-family:var(--serif);font-size:2.5em;line-height:1.05}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .iconbtn{border:1px solid var(--line2);border-radius:50%;width:30px;height:30px}

/* onboarding */
.ob{max-width:580px;margin:5vh auto;padding:0 18px 60px}
.ob .steps{display:flex;gap:6px;margin:0 0 22px}
.ob .steps i{height:5px;flex:1;border-radius:5px;background:var(--line2)}
.ob .steps i.on{background:var(--a)}
.banner{background:var(--a);color:#fff;font-size:.85em;padding:8px 16px;text-align:center;position:sticky;top:0;z-index:40}
.banner a{color:#fff;font-weight:500}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.themes button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px 7px;font-size:.78em;display:flex;flex-direction:column;align-items:center;gap:6px}
.themes button.on{border-color:var(--ink)}
.themes .sw{display:flex;width:100%;height:22px;border-radius:7px;overflow:hidden}
.themes .sw i{flex:1}

/* ------------------------------------------------ responsive */
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.minis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:980px){
  .g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}
  .main{padding:24px 22px 120px}
}
@media (max-width:760px){
  .side{display:none}
  .main{padding:16px 14px 110px;max-width:none}
  h1{font-size:1.55em}
  .big{font-size:3.2em}
  .card>.body{padding:15px 15px}
  .card>.band{padding:10px 14px}
  .topbar{margin-bottom:14px;align-items:flex-start}
  .topbar .acts .hide-m{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .tile b{font-size:1.4em}
  .minis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .themes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .donutwrap{flex-direction:column;align-items:stretch}.donutwrap svg{align-self:center}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
  .tabbar a,.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--ink);text-decoration:none;padding:4px 6px;min-width:56px}
  .tabbar a svg,.tabbar button svg{width:21px;height:21px}
  .tabbar a.on{color:var(--a)}
  html[data-dark="1"] .tabbar a.on{color:var(--a2)}
  .tabbar .fab{width:52px;height:52px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 20px color-mix(in srgb,var(--a) 40%,transparent);min-width:0;padding:0}
  .tabbar .fab svg{width:24px;height:24px}
  .cday{min-height:54px;padding:4px}
  .ev{font-size:0;padding:0;height:5px;border-left:0;background:var(--a);border-radius:3px}
  .ev.income{background:var(--ok)}.ev.sub{background:var(--p3)}.ev.debt{background:var(--bad)}.ev.save{background:var(--b)}
  .ev.spend{font-size:9px;height:auto;background:none;color:var(--ink2)}
  .cal{gap:3px}
  .scrim{align-items:flex-end;padding:0}
  .modal{border-radius:24px 24px 0 0;max-height:94dvh;max-width:none}
  .toast{bottom:92px}
  .monthpick b{min-width:104px}
}
@media print{.side,.tabbar,.topbar .acts{display:none}.main{padding:0}}
.item>svg{width:18px;height:18px;flex:none;color:var(--ink3)}
.nextcard .body{flex-wrap:wrap}.nextcard .grow{flex:1 1 220px}
@media (max-width:760px){.nextcard .nbtns{width:100%;justify-content:flex-start!important;padding-left:58px}}
@media (max-width:760px){.topbar .simpletog{display:none}}
.obhead,.obrow{display:grid;grid-template-columns:34px minmax(0,1fr) 104px 150px 156px 34px;gap:8px;align-items:center}
.obhead{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:500;padding-bottom:6px}
.obrow{padding:7px 0;border-top:1px solid var(--line)}.obrow .e{text-align:center;font-size:1.15em}
.ob{max-width:760px}
@media (max-width:760px){.obhead{display:none}.obrow{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 34px;row-gap:6px}.obrow [data-obf=name]{grid-column:2/4}.obrow .iconbtn{grid-column:4;grid-row:1}.obrow [data-obf=amount]{grid-column:2}.obrow select{grid-column:3}.obrow [data-obf=next]{grid-column:2/4}}
/* tick circles: mark a payment as paid */

<body data-theme="Sage"><div id="root"></div>
<script>window.BP_DEMO=true;window.BP_SHOP="https://www.etsy.com/shop/TrueHavenStudios";window.BP_VERSION="1.0.0";window.BP_SYNC_URL="https://truehaven-sync.fishing-switzerland.workers.dev";</script>
<script>/* TrueHaven Sync – end-to-end-encrypted device sync for the offline apps (client module).
   One file, no libraries, WebCrypto only. Works in browsers and in Node 20+ (for tests).

   Usage in an app (see README.md):
     const SYNC = THSync.create({
       appId: "bills", appName: "Bill Smoother", storageKey: "thbills.v1", url: window.BP_SYNC_URL, demo: DEMO,
       getState: () => JSON string of the whole state (as it is saved),
       applyState: json => replace the whole state through the app's normal load/migrate path, save it, re-render,
       onChange: notify => { remember notify; call it after every local save },
       describe: json => "12 bills · 3 jars"      (optional, shown in the conflict dialog),
       hasData: () => true if this device holds data worth protecting  (optional),
       validate: json => throws if json isn't this app's data       (optional),
       rerender: () => app re-render                                   (optional)
     });
     SYNC.start();                     // after the app's first render
     SYNC.pillHTML()                   // status pill, put it anywhere (updates itself)
     SYNC.sectionHTML()                // the "Your devices" settings block (updates itself)
     SYNC.openJoin()                   // "I already use it on another device"

   Security model, briefly:
   - Device A makes a random spaceId (128 bit), dataKey (AES-GCM 256) and writeToken (256 bit).
   - Every save is encrypted on the device: AES-GCM, fresh 96-bit IV, additional data = app id + spaceId + version,
     so the server can't swap copies between apps/spaces or pass an old copy off as a newer one.
   - The server stores ciphertext + sha256(writeToken) only. Anyone without the dataKey sees random bytes.
   - Linking: either a 6-digit code (online, server-mediated, see the honest note at pairSeal) or a QR/link whose
     #fragment carries the secrets directly – fragments are never sent to any server.
   - Secrets live in localStorage next to the app's own data (which is plain text there anyway). */
(function (root) {
  "use strict";
  const VERSION = 1;
  const PBKDF2_ITER = 600000;          // OWASP 2023 recommendation for PBKDF2-HMAC-SHA256
  const DEBOUNCE = 3000, POLL = 60000, BACKOFF = [2000, 4000, 8000, 16000, 32000, 60000];
  const MAX_CT = 1800000;              // keep in step with worker.js
  const te = new TextEncoder(), td = new TextDecoder();
  const subtle = () => (root.crypto || globalThis.crypto).subtle;
  const rand = n => { const a = new Uint8Array(n); (root.crypto || globalThis.crypto).getRandomValues(a); return a; };

  // ------------------------------------------------------------------ bytes
  function b64(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
  function unb64(s) { const t = atob(s), a = new Uint8Array(t.length); for (let i = 0; i < t.length; i++) a[i] = t.charCodeAt(i); return a; }
  const b64url = bytes => b64(bytes).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const unb64url = s => unb64(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
  const cat = (...arrs) => { const n = arrs.reduce((a, x) => a + x.length, 0), o = new Uint8Array(n); let p = 0; for (const x of arrs) { o.set(x, p); p += x.length; } return o; };
  async function sha256hex(s) { const d = await subtle().digest("SHA-256", te.encode(s)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join(""); }

  async function pipe(bytes, Stream, mode) {
    const s = new Blob([bytes]).stream().pipeThrough(new Stream(mode));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  const canZip = () => typeof CompressionStream === "function" && typeof DecompressionStream === "function";

  // ------------------------------------------------------------------ crypto
  function newSecrets() { return { space: b64url(rand(16)), key: b64url(rand(32)), token: b64url(rand(32)) }; }
  const keyCache = new Map();
  async function dataKey(k) {
    if (!keyCache.has(k)) keyCache.set(k, await subtle().importKey("raw", unb64url(k), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]));
    return keyCache.get(k);
  }
  const aad = (appId, space, version) => te.encode(`th-sync/v${VERSION}|${appId}|${space}|${version}`);
  // envelope: [1 format][1 flags: 1 = gzip][12 IV][AES-GCM ciphertext+tag], base64
  async function seal(key, appId, space, version, text) {
    let data = te.encode(text), flags = 0;
    if (canZip()) { data = await pipe(data, CompressionStream, "gzip"); flags = 1; }
    const iv = rand(12);
    const ct = new Uint8Array(await subtle().encrypt({ name: "AES-GCM", iv, additionalData: aad(appId, space, version) }, await dataKey(key), data));
    return b64(cat(Uint8Array.of(VERSION, flags), iv, ct));
  }
  async function open(key, appId, space, version, ctB64) {
    const all = unb64(ctB64);
    if (all[0] !== VERSION) throw new Error("unknown format");
    const iv = all.subarray(2, 14), ct = all.subarray(14);
    let data = new Uint8Array(await subtle().decrypt({ name: "AES-GCM", iv, additionalData: aad(appId, space, version) }, await dataKey(key), ct));
    if (all[1] & 1) data = await pipe(data, DecompressionStream, "gzip");
    return td.decode(data);
  }

  /* Pairing with a 6-digit code – how strong is it, honestly?
     A 6-digit code has only 1,000,000 possibilities (~20 bits). Its safety comes from being ONLINE and SHORT-LIVED:
       - the server hands out each code's blob exactly once, deletes it after 10 minutes, and limits lookups to
         10 per minute (60 per hour) per IP address – an attacker guessing blindly has roughly a 1-in-10,000 chance
         per IP during the 10 minutes, and a successful guess "uses up" the code, so the real device sees
         "code didn't work" and the linking screen never says "Linked" – a visible warning sign;
       - PBKDF2 (600,000 rounds, random salt) only slows down someone who already holds the blob (e.g. whoever runs
         the server): trying all million codes then costs hours of GPU time, not years. It is NOT strong offline.
     So: fine for linking your own phone while you hold both devices, not a long-term secret.
     The QR code / link is the strong path: it carries the 256-bit keys in the URL #fragment, which browsers never
     send to any server – nothing guessable is involved at all. */
  async function codeKey(code, salt) {
    const base = await subtle().importKey("raw", te.encode(code), "PBKDF2", false, ["deriveKey"]);
    return subtle().deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: PBKDF2_ITER }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function pairSeal(code, appId, payload) {
    const salt = rand(16), iv = rand(12);
    const ct = new Uint8Array(await subtle().encrypt({ name: "AES-GCM", iv, additionalData: te.encode("th-pair/v1|" + appId) }, await codeKey(code, salt), te.encode(JSON.stringify(payload))));
    return b64(cat(Uint8Array.of(1), salt, iv, ct));
  }
  async function pairOpen(code, appId, blob) {
    const all = unb64(blob);
    if (all[0] !== 1) throw new Error("unknown format");
    const pt = await subtle().decrypt({ name: "AES-GCM", iv: all.subarray(17, 29), additionalData: te.encode("th-pair/v1|" + appId) }, await codeKey(code, all.subarray(1, 17)), all.subarray(29));
    return JSON.parse(td.decode(pt));
  }
  // link: <app url>#link=<appId>.<base64url([1][16 space][32 key][32 token])>
  function linkEncode(appId, s) { return appId + "." + b64url(cat(Uint8Array.of(1), unb64url(s.space), unb64url(s.key), unb64url(s.token))); }
  function linkDecode(str) {
    const m = /(?:#link=|^)([a-z0-9-]+)\.([A-Za-z0-9_-]{100,120})$/.exec(String(str || "").trim());
    if (!m) return null;
    const b = unb64url(m[2]);
    if (b.length !== 81 || b[0] !== 1) return null;
    return { app: m[1], space: b64url(b.subarray(1, 17)), key: b64url(b.subarray(17, 49)), token: b64url(b.subarray(49, 81)) };
  }

  // ------------------------------------------------------------------ QR code (byte mode, ECC M, versions 1–20)
  const QR = (() => {
    const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26];
    const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16];
    const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
    const rawMods = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
    const dataCw = v => Math.floor(rawMods(v) / 8) - ECC[v] * BLK[v];
    function rsDiv(d) { const r = new Array(d - 1).fill(0).concat([1]); let root = 1; for (let i = 0; i < d; i++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = mul(root, 2); } return r; }
    function rsRem(data, div) { const r = div.map(() => 0); for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); } return r; }
    function encode(text, forceMask) {
      const bytes = [...te.encode(text)];
      let v = 1; for (; v <= 20; v++) { if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= dataCw(v) * 8) break; }
      if (v > 20) throw new Error("too long for a QR code");
      const bits = [], put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
      put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
      const cap = dataCw(v) * 8;
      put(0, Math.min(4, cap - bits.length)); put(0, (8 - bits.length % 8) % 8);
      for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
      const data = []; for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => a << 1 | b, 0));
      // split into blocks, add error correction, interleave
      const nb = BLK[v], el = ECC[v], raw = Math.floor(rawMods(v) / 8), nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = rsDiv(el), blocks = [];
      for (let i = 0, k = 0; i < nb; i++) { const d = data.slice(k, k + shortLen - el + (i < nShort ? 0 : 1)); k += d.length; const e = rsRem(d, div); if (i < nShort) d.push(0); blocks.push(d.concat(e)); }

/* engine: dates, recipes, picking logic, shopping list, insights – no DOM */
const E = {
  ds: d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"),
  pd: s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); },
  addDays: (s, n) => { const d = E.pd(s); d.setDate(d.getDate() + n); return E.ds(d); },
  diff: (a, b) => Math.round((E.pd(b) - E.pd(a)) / 864e5),
  ym: s => s.slice(0, 7),
  ymAdd: (m, n) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1); return E.ds(d).slice(0, 7); },
  dow: s => E.pd(s).getDay(),
  sum: (a, f = x => x) => a.reduce((t, x) => t + (+f(x) || 0), 0),
  r2: v => Math.round(v * 100) / 100,
  weekStart: (s, ws = 1) => { const k = (E.dow(s) - ws + 7) % 7; return E.addDays(s, -k); }
};

// ------------------------------------------------------------ recipes (amounts for 2 servings)
// energy: 0 = barely any (no-cook or one tray), 1 = some (15–25 min), 2 = feeling good (proper cooking)
// tags: v vegetarian · k kids like it · f freezes well · q 15 min or less
// ingredient: aisle:qty unit name   aisles p fruit & veg, m meat & fish, d dairy & eggs, b bread, f frozen, s pantry
const STAPLE = ["olive oil", "soy sauce", "cumin", "chili powder", "curry paste", "salt", "pepper", "cinnamon", "chili flakes"];
const MEAT_W = /chicken|beef|pork|bacon|sausage|\bham\b|turkey|lamb|mince|chorizo|prosciutto|hot dog/, FISH_W = /salmon|tuna|\bcod\b|shrimp|prawn|fish|anchov/;
const ANIMAL_W = /\begg|\bmilk|cheese|cheddar|feta|mozzarella|parmesan|ricotta|halloumi|yogurt|\bbutter|cream|honey|mayo/, PLANT_OK = /coconut milk|peanut butter|oat drink/;
function dietOf(r) { const ns = r.i.map(x => parseIng(x).n.toLowerCase()); const meat = ns.some(n => MEAT_W.test(n)), fish = ns.some(n => FISH_W.test(n)), animal = ns.some(n => !PLANT_OK.test(n) && ANIMAL_W.test(n));
  return meat ? "all" : fish ? "pescatarian" : animal ? "vegetarian" : "vegan"; }
const DIETS = [["all", "Everything"], ["pescatarian", "Pescatarian"], ["vegetarian", "Vegetarian"], ["vegan", "Vegan"]];
const dietOk = (want, has) => want === "all" || (want === "pescatarian" && has !== "all") || (want === "vegetarian" && (has === "vegetarian" || has === "vegan")) || (want === "vegan" && has === "vegan");
const AISLE = { p: "Fruit & veg", b: "Bread & bakery", m: "Meat & fish", d: "Dairy & eggs", f: "Frozen", s: "Pantry", x: "Everything else" };
const AORDER = ["p", "b", "m", "d", "f", "s", "x"];
const SHELF = { p: 5, m: 2, d: 6, b: 3 };
const ENERGY = [["Barely any", "No-cook or one tray"], ["Some", "About 15 to 25 minutes"], ["Feeling good", "Proper cooking"]];
const SLOTS = [["breakfast", "Breakfast"], ["lunch", "Lunch"], ["dinner", "Dinner"]];
const BASE = R0.map((r, i) => ({ id: "b" + i, n: r[0], e: r[1], t: r[2], c: r[3], tags: r[4], i: r[5], s: r[6], slot: r[7] || "dinner" }));
BASE.forEach(r => { r.diet = dietOf(r); if (r.diet !== "all" && r.diet !== "pescatarian" && !r.tags.includes("v")) r.tags += "v"; if (r.diet === "vegan") r.tags += "g"; });
function parseIng(s) {
  const k = s.indexOf(":"), a = k > 0 && k < 3 ? s.slice(0, k) : "s", rest = k > 0 && k < 3 ? s.slice(k + 1) : s;
  const m = rest.match(/^([\d.]+)\s+(g|kg|ml|l|tbsp|tsp|pc|can|pack|bunch|cup)\s+(.+)$/);
  return m ? { a, q: +m[1], u: m[2], n: m[3].trim() } : { a, q: 1, u: "pc", n: rest.trim() };
}
function fmtQ(q, u) {
  let v = ["pc", "can", "pack", "bunch"].includes(u) ? Math.ceil(q * 2) / 2 : ["g", "ml"].includes(u) ? (q >= 100 ? Math.round(q / 10) * 10 : Math.round(q)) : Math.round(q * 4) / 4;
  if (u === "g" && v >= 1000) return (Math.round(v / 100) / 10) + " kg";
  if (u === "ml" && v >= 1000) return (Math.round(v / 100) / 10) + " l";
  const fr = { .25: "¼", .5: "½", .75: "¾" }[Math.round(v % 1 * 100) / 100], w = Math.floor(v);
  const s = v % 1 ? (fr ? (w ? w : "") + fr : v.toFixed(1)) : String(v);
  return s + (u === "pc" ? "" : " " + u);
}

// ------------------------------------------------------------ the picking logic
const MP = {
  recipes: S => BASE.concat(S.mine || []).filter(r => !(S.hidden || []).includes(r.id) && dietOk((S.settings || {}).diet || "all", r.diet || dietOf(r))),
  rec: (S, id) => BASE.concat(S.mine || []).find(r => r.id === id),
  slot: (S, d, slot = "dinner") => ((S.plan[d] || {})[slot]) || null,
  eaters: (S, d) => { const ids = (S.plan[d] || {}).eat; return S.people.filter(p => !ids || ids.includes(p.id)); },
  portions: (S, d) => { const e = d ? MP.eaters(S, d) : S.people; return Math.max(1, E.sum(e, p => p.kid ? .5 : 1)) || S.settings.people || 2; },
  dislikes: (S, d) => [...new Set(MP.eaters(S, d).flatMap(p => p.no || []).map(x => x.toLowerCase().trim()).filter(Boolean))],
  okFor: (S, r, d) => { const no = MP.dislikes(S, d); return !no.some(w => r.n.toLowerCase().includes(w) || r.i.some(x => parseIng(x).n.toLowerCase().includes(w))); },
  usesFridge: (S, r) => (S.fridge || []).filter(f => r.i.some(x => { const n = parseIng(x).n.toLowerCase(), g = f.n.toLowerCase(); return n.includes(g) || g.includes(n); })),
  recent: (S, from, days = 10) => { const o = new Set(); for (let i = -days; i <= 7; i++) { const p = MP.slot(S, E.addDays(from, i)); if (p && p.r) o.add(p.r); } return o; },
  isLow: (S, d) => (S.settings.low || []).includes(E.dow(d)),
  reason: (S, r, d, low) => {
    const w = [];
    if ((S.go || []).includes(r.id)) w.push("a go-to");
    if (low && r.e === 0) w.push("fits a low-energy day");
    const f = MP.usesFridge(S, r); if (f.length) w.push("uses up " + f.slice(0, 2).map(x => x.n.toLowerCase()).join(" & "));
    if (!w.length) w.push(["zero effort", "easy", "worth the effort"][r.e]);
    return w.join(" · ");
  },
  // never more than a few choices: fits the energy, someone at the table won't refuse it, not eaten lately
  choices: (S, d, maxE, n = 3, exclude = [], slot = "dinner") => {
    const rc = MP.recent(S, d);
    return MP.recipes(S).filter(r => r.slot === slot && r.e <= maxE && !exclude.includes(r.id) && MP.okFor(S, r, d))
      .map(r => ({ r, s: Math.random() * .9 + ((S.go || []).includes(r.id) ? 1.2 : 0) + MP.usesFridge(S, r).length * 1.4 - (rc.has(r.id) ? 2.5 : 0) + (r.e === maxE ? .3 : 0) }))
      .sort((a, b) => b.s - a.s).slice(0, n).map(x => x.r);
  },
  fill: (S, from, t) => {
    const out = [], used = [];
    for (let i = 0; i < 7; i++) {
      const d = E.addDays(from, i); if (d < t || MP.slot(S, d)) continue;
      const low = MP.isLow(S, d), th = (S.settings.themes || {})[E.dow(d)];
      if (th === "out") { out.push({ d, out: true, why: "your eat-out night" }); continue; }
      const maxE = low ? 0 : [0, 6].includes(E.dow(d)) ? 2 : 1;
      let pool = MP.choices(S, d, maxE, 6, used);
      if (th === "veg") pool = pool.filter(r => r.tags.includes("v")).concat(pool);
      const r = pool[0]; if (!r) continue;
      used.push(r.id); out.push({ d, r, why: (th === "veg" ? "meat-free night · " : "") + MP.reason(S, r, d, low) });
    }
    return out;
  },
  startBy: (S, r, d) => { const [h, m] = (S.settings.dinner || "18:30").split(":").map(Number); const x = E.pd(d); x.setHours(h, m - (r ? r.t : 20) - 5, 0, 0); return x; },
  // shopping list for a range of days: amounts follow who's eating, leftovers & freezer meals add nothing
  shopping: (S, from, to) => {
    const agg = {};
    for (let d = from; d <= to; d = E.addDays(d, 1)) for (const [sl] of SLOTS) {
      const p = MP.slot(S, d, sl); if (!p || !p.r) continue; const r = MP.rec(S, p.r); if (!r) continue;
      const k = (sl === "dinner" ? MP.portions(S, d) : MP.portions(S, d)) * (p.x || 1) / 2;
      r.i.forEach(x => { const g = parseIng(x); if (STAPLE.includes(g.n.toLowerCase())) return; const key = g.n.toLowerCase() + "|" + g.u;
        (agg[key] = agg[key] || { n: g.n, u: g.u, a: g.a, q: 0, for: [] }); agg[key].q += g.q * k; if (!agg[key].for.includes(r.n)) agg[key].for.push(r.n); });
    }
    return Object.values(agg);
  },
  // per week: home-cooked, leftovers & freezer, ate out; grocery and takeout spend
  weeks: (S, t, n = 8) => {
    const ws = E.weekStart(t, S.settings.weekStart), out = [];
    for (let w = n - 1; w >= 0; w--) {
      const s = E.addDays(ws, -7 * w), e = E.addDays(s, 6); let home = 0, left = 0, eo = 0;
      for (let d = s; d <= e && d <= t; d = E.addDays(d, 1)) { const p = MP.slot(S, d); if (!p) continue; if (p.out) eo++; else if ((p.left || p.frz) && p.done) left++; else if (p.done) home++; }
      const sp = (S.spend || []).filter(x => x.date >= s && x.date <= e);
      out.push({ s, home, left, out: eo, groc: E.sum(sp.filter(x => x.kind === "groc"), x => x.amount), take: E.sum(sp.filter(x => x.kind === "take"), x => x.amount) });
    }
    return out;
  }
};

let _nf = {};

function curDigits() { try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur() }).resolvedOptions().maximumFractionDigits; } catch (e) { return 2; } }
const fmt = v => nf(curDigits()).format(Math.abs(v) < 0.005 ? 0 : v || 0);
const fmt0 = v => nf(0).format(Math.round(v || 0));
const fmtk = v => { if (Math.abs(v) < 10000) return fmt0(v); const k = Math.abs(v) / 1000, d = Math.abs(k - Math.round(k)) > .05 ? 1 : 0; return (v < 0 ? "−" : "") + nf(0).format(0).replace(/0/, (d ? k.toFixed(1) : Math.round(k)) + "k"); };
function symbol() { try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur() }).formatToParts(0).find(p => p.type === "currency").value; } catch (e) { return cur(); } }
function bigNum(v) {
  const neg = v < 0, a = Math.abs(v), whole = Math.floor(a + 1e-9), ct = Math.round((a - whole) * 100) % 100;
  const w = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(curDigits() ? whole : Math.round(a));
  return `<span class="big ${neg ? "neg" : ""}"><span class="cur">${neg ? "−" : ""}${esc(symbol())}</span>${w}${curDigits() ? `<span class="ct">.${String(ct).padStart(2, "0")}</span>` : ""}</span>`;
}
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) + "%" : "–";
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DOWL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const dshort = s => { const d = E.pd(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };

// money typed any common way: 1234.56 · 1,234.56 · 1.234,56 · 1 234,56 · 1'234.50 · 12,50
const num = v => {
  if (v == null) return NaN; if (typeof v === "number") return v;
  let s = String(v).trim().replace(/[\s  '’`]/g, "");
  const neg = /^[-−]/.test(s) || /^\(.*\)$/.test(s);
  s = s.replace(/[^\d,.]/g, ""); if (!/\d/.test(s)) return NaN;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");

  let dec = Math.max(lc, ld);

  const int = (dec < 0 ? s : s.slice(0, dec)).replace(/[.,]/g, ""), fr = dec < 0 ? "" : s.slice(dec + 1).replace(/[.,]/g, "");
  const r = parseFloat((int || "0") + (fr ? "." + fr : ""));
  return neg ? -r : r;
};

  const groc = wk[wk.length - 1].groc, portions = E.sum(S.freezer, z => z.portions);
  const tiles = `<div class="tiles">${tile("Planned this week", `${planned}<small>/7</small>`, planned < 7 ? `<button class="link" data-act="fillWeek">Fill the rest</button>` : "all set", planned === 7 ? "ok" : "")}
    ${tile("Home dinners", home, "this month", "ok")}${tile("At home", (S.pantry || []).length, "things in your kitchen")}
    ${tile("In the freezer", portions, plural(portions, "portion") + " ready")}${tile("Use it first", useSoon().length, useSoon().length ? "need using soon" : "nothing urgent", useSoon().length ? "bad" : "ok")}
    ${tile("Fresh food used", S.used + S.tossed ? Math.round(S.used / (S.used + S.tossed) * 100) + "%" : "–", "instead of tossed")}</div>`;
  const days = []; for (let i = 0; i < 7; i++) { const d = E.addDays(t, i), q = slotName(MP.slot(S, d)); days.push(`<div class="item click" data-act="dayMenu" data-d="${d}">${dateBox(d, i ? "" : "a")}<div class="grow"><div class="nm">${q ? esc(q.n) : `<span class="faint">Nothing planned</span>`}</div><div class="tiny muted">${i === 0 ? "today" : i === 1 ? "tomorrow" : DOWL[E.dow(d)]}${isLow(d) ? ` · <span class="tag">low-energy day</span>` : ""}</div></div>${ic("right")}</div>`); }
  const coming = card("Next 7 days", `<div class="list">${days.join("")}</div>`, { right: `<button class="lnk" data-go="week">Week</button>`, tight: true });
  return top + `<div style="margin-bottom:18px">${nextStep()}</div><div class="grid g12 start">${hero}${tiles}</div>
    <div class="grid g3 mt start">${budgetCard()}${fromHomeCard(3)}${grocChartCard()}</div>
    <div class="grid g21 mt start"><div class="col">${energy}${choices}</div><div class="col">${fridgeCard(3)}${coming}</div></div>
    <p class="tiny faint" style="text-align:center;margin-top:18px">Too much at once? <button class="link" data-act="simple" data-v="1">Simple view</button></p>`;
}
// one thing, never a wall of tasks
function nextStep() {
  const t = today(), tm = E.addDays(t, 1), p = MP.slot(S, t), pt = MP.slot(S, tm);
  const urgent = (S.pantry || []).filter(f => f.exp).sort((a, b) => leftDays(a) - leftDays(b))[0];
  let ico = "spark", txt = "You're set. Nothing needs you right now.", btns = "";
  if (pt && pt.frz && !pt.thawed) { ico = "snow"; txt = `<b>${esc(pt.n)}</b> is tomorrow's dinner. Take it out of the freezer tonight so it can thaw in the fridge.`; btns = `<button class="btn sm pri" data-act="thawed" data-d="${tm}">${ic("check")}Done</button>`; }
  else if (urgent && leftDays(urgent) <= 0) { ico = "fridge"; txt = `<b>${esc(urgent.n)}</b> needs using today. Cook it, freeze it, or let it go.`; btns = `<button class="btn sm" data-act="fUse" data-id="${urgent.id}" data-v="used">Used it</button><button class="btn sm" data-act="fUse" data-id="${urgent.id}" data-v="frozen">${ic("snow")}Froze it</button>`; }
  else if (!p) { ico = "dice"; txt = "Nothing planned for tonight yet. Tap your energy and pick one of 3."; btns = `<button class="btn sm pri" data-act="decide">${ic("dice")}Decide for me</button>`; }
  else if (E.dow(t) === (S.settings.weekStart + 6) % 7 && [1, 2, 3, 4, 5, 6, 7].filter(i => MP.slot(S, E.addDays(t, i))).length < 3) { ico = "week"; txt = "Next week is still empty. Two minutes now saves seven decisions later."; btns = `<button class="btn sm pri" data-act="fillNext">${ic("dice")}Fill next week</button>`; }
  return `<section class="card nextcard"><div class="body row" style="gap:14px"><div class="emo" style="width:44px;height:44px;background:var(--a1);color:var(--a)">${ic(ico)}</div><div class="grow"><div class="caps" style="font-size:.64em">One thing right now</div><div style="margin-top:2px">${txt}</div></div>${btns ? `<div class="row wrap nbtns" style="gap:6px;justify-content:flex-end">${btns}</div>` : ""}</div></section>`;
}
function startList() {
  if (DEMO || S.settings.hideStart || S.sample) return "";
  const steps = [["Add who's eating", S.people.length > 0, `data-go="household"`], ["Plan your first week", Object.keys(S.plan).length >= 3, `data-act="fillWeek"`],
    ["Tick off your shopping list", (S.trips || []).length || Object.keys(S.list).some(k => S.list[k].length), `data-go="list"`], ["Mark a few go-to meals", S.go.length >= 3, `data-go="recipes"`]];
  const done = steps.filter(s => s[1]).length; if (done === steps.length) return "";
  return `<section class="card" style="margin-bottom:18px"><div class="band soft"><span class="t">Getting started · ${done} of ${steps.length}</span><span class="r"><button class="lnk" data-act="hideStart">Hide</button></span></div><div class="body tight"><div class="list">
    ${steps.map(([l, ok, a]) => `<div class="item ${ok ? "" : "click"}" ${ok ? "" : a}><span class="emo" style="width:30px;height:30px;${ok ? "background:var(--okbg);color:var(--ok)" : ""}">${ok ? ic("check", "i16") : "○"}</span><span class="grow ${ok ? "faint" : "nm"}" style="${ok ? "text-decoration:line-through" : ""}">${l}</span>${ok ? "" : ic("right")}</div>`).join("")}</div></div></section>`;
}
function fridgeCard(n) {
  const fr = [...S.fridge].sort((a, b) => leftDays(a) - leftDays(b)), show = n ? fr.slice(0, n) : fr;
  const row = f => { const l = leftDays(f); return `<div class="item"><div class="date ${l <= 1 ? "b" : ""}"><b>${Math.max(0, l)}</b><span>day${l === 1 ? "" : "s"}</span></div><div class="grow"><div class="nm">${esc(f.n)}</div><div class="tiny ${l <= 1 ? "badc" : "muted"}">${l < 0 ? "past its best – check it" : l === 0 ? "use today" : l === 1 ? "use by tomorrow" : l + " days left"}${(() => { const r = MP.recipes(S).find(x => x.slot === "dinner" && MP.usesFridge({ fridge: [f] }, x).length); return r && l <= 2 ? ` · try ${esc(r.n)}` : ""; })()}</div></div>
    <div class="row" style="gap:4px"><button class="btn sm" data-act="fUse" data-id="${f.id}" data-v="used">Used</button><button class="iconbtn" data-act="fUse" data-id="${f.id}" data-v="frozen" title="Froze it" aria-label="Froze it">${ic("snow")}</button><button class="iconbtn" data-act="fUse" data-id="${f.id}" data-v="tossed" title="Tossed" aria-label="Tossed">${ic("trash")}</button></div></div>`; };
  return card(`Use it first`, show.length ? `<div class="list">${show.map(row).join("")}</div>` : `<div class="empty">Fresh food lands here when you tick it off your shopping list – so nothing rots at the back of the fridge.</div>`,
    { right: n ? `<button class="lnk" data-go="kitchen">All</button>` : `<button class="lnk" data-act="addFridge">${ic("plus", "i16")} Add</button>`, tight: true, b: true });
}

// ------------------------------------------------------------ week
function vWeek() {
  const t = today(), s = E.addDays(E.weekStart(t, S.settings.weekStart), 7 * VS.wk), e = E.addDays(s, 6), slots = S.settings.slots;
  const title = VS.wk === 0 ? "This week" : VS.wk === 1 ? "Next week" : VS.wk === -1 ? "Last week" : `Week of ${dshort(s)}`;
  const pick = `<div class="monthpick"><button class="iconbtn" data-act="wPrev" aria-label="Previous week">${ic("left")}</button><b>${dshort(s)} – ${dshort(e)}</b><button class="iconbtn" data-act="wNext" aria-label="Next week">${ic("right")}</button></div>`;
  const top = head(`${dshort(s)} – ${dshort(e)} · ${s.slice(0, 4)}`, title, `${pick}<button class="btn pri" data-act="fillWeek">${ic("dice")}Fill my week</button>`, "Two minutes now, no decisions later. Skipped a day? It just stays empty.");
  let rows = "";
  for (let i = 0; i < 7; i++) {
    const d = E.addDays(s, i), th = (S.settings.themes || {})[E.dow(d)];
    const cells = SLOTS.filter(([k]) => slots.includes(k)).map(([k, lab]) => {
      const p = MP.slot(S, d, k), q = slotName(p);
      return `<button class="mslot ${q ? "" : "empty"} ${p && p.done ? "done" : ""}" data-act="dayMenu" data-d="${d}" data-slot="${k}">${slots.length > 1 ? `<span class="sl">${lab}</span>` : ""}${q ? `<span class="ic" style="color:var(--a)">${ic(q.c)}</span><span class="grow"><b>${esc(q.n)}</b><span class="tiny muted">${q.sub}</span></span>${p.done ? `<span class="okc">${ic("check")}</span>` : ""}` : `<span class="grow faint">${d < t ? "Nothing logged – that's okay" : "+ Add " + lab.toLowerCase()}</span>`}</button>`;
    }).join("");
    rows += `<div class="wday ${d === t ? "today" : ""}">${dateBox(d, d === t ? "a" : "")}<div class="grow"><div class="tiny muted wdn">${DOWL[E.dow(d)]}${th ? ` <span class="tag">${{ low: "low-energy day", veg: "meat-free", out: "eat-out night" }[th]}</span>` : ""}</div><div class="cells">${cells}</div></div></div>`;
  }
  // week check: fresh things only one meal uses, so part of the pack may go to waste
  const items = MP.shopping(S, s, e).filter(x => ["p", "d", "m"].includes(x.a) && x.for.length === 1 && !["pc"].includes(x.u) || (x.u === "bunch" && x.for.length === 1));
  const check = card("Week check", items.length ? `<p class="small muted" style="margin-top:0">These are in just one meal, so part of the pack may be left over. Plan a second meal that uses them – or freeze the rest.</p><div class="list">${items.slice(0, 5).map(x => { const alt = MP.recipes(S).filter(r => r.slot === "dinner" && !x.for.includes(r.n) && r.i.some(y => parseIng(y).n.toLowerCase() === x.n.toLowerCase())).slice(0, 2); return `<div class="item"><div class="grow"><div class="nm">${esc(x.n)}</div><div class="tiny muted">only in ${esc(x.for[0])}${alt.length ? ` · also in ${alt.map(a => esc(a.n)).join(", ")}` : ""}</div></div></div>`; }).join("")}</div>` : `<div class="empty">Nice – everything fresh this week is used more than once, or not planned yet.</div>`, { tight: true, b: true });
  const thm = card("Your week's rhythm", `<div class="list">${[1, 2, 3, 4, 5, 6, 0].map(dw => { const v = (S.settings.themes || {})[dw]; return `<div class="item"><span class="grow">${DOWL[dw]}</span><span class="tiny ${v ? "" : "faint"}">${{ low: "Low-energy day", veg: "Meat-free", out: "Eat out" }[v] || "Anything"}</span></div>`; }).join("")}</div><button class="btn sm mt" data-go="household">Change</button>`, { tight: true });
  return top + `<div class="grid g21 start"><section class="card"><div class="body tight">${rows}</div></section><div class="col">${check}${thm}</div></div>`;
}

// ------------------------------------------------------------ shopping list
const tkey = x => x.n.toLowerCase() + (x.ex || !x.u ? "" : "|" + x.u), isDone = (done, x) => done.includes(tkey(x)) || done.includes(x.n.toLowerCase());
function listRange() { const t = today(), ws = E.weekStart(t, S.settings.weekStart); return VS.nw ? [E.addDays(ws, 7), E.addDays(ws, 13), E.addDays(ws, 7)] : [t, E.addDays(ws, 6), ws]; }
function vList() {
  const [from, to, key] = listRange(), all = MP.shopping(S, from, to), items = all.filter(x => x.home !== "all"), athome = all.filter(x => x.home === "all"), done = S.list[key] || [];
  S.extra.forEach(x => items.push({ n: x.n, u: "", a: "x", q: 0, for: [], ex: x.id }));
  const left = items.filter(x => !isDone(done, x)).length;
  const seg = `<div class="seg"><button class="${VS.nw ? "" : "on"}" data-act="nw" data-v="0">This week</button><button class="${VS.nw ? "on" : ""}" data-act="nw" data-v="1">Next week</button></div>`;
  const top = head(VS.nw ? `Next week · ${dshort(from)} – ${dshort(to)}` : `Today until ${DOWL[E.dow(to)]}`, "Shopping list", `${seg}<button class="btn ${VS.store ? "pri" : ""}" data-act="store">${ic("cart")}${VS.store ? "Done shopping" : "I'm at the store"}</button>`,
    `${plural(left, "thing")} to get · amounts for ${plural(MP.portions(S), "portion")} · sorted the way you walk the store`);
  const add = `<section class="card"><div class="body row" style="gap:8px"><input class="inp" id="addx" placeholder="Add anything: milk, dish soap…" autocomplete="off"><button class="btn pri" data-act="addExtra">${ic("plus")}Add</button></div></section>`;
  const groups = AORDER.map(a => {
    let g = items.filter(x => x.a === a); if (VS.store) g = g.filter(x => !isDone(done, x));
    if (!g.length) return ""; g.sort((x, y) => x.n.localeCompare(y.n));
    return card(AISLE[a], `<div class="list">${g.map(x => { const dn = isDone(done, x); return `<div class="item click shop ${dn ? "paid" : ""}" data-act="tick" data-n="${esc(tkey(x))}" data-a="${x.a}"><button class="tick ${dn ? "on" : ""}" aria-label="Got it">${ic("check")}</button><div class="grow"><div class="nm">${esc(x.n[0].toUpperCase() + x.n.slice(1))}${x.q ? ` <span class="muted">· ${fmtQ(x.q, x.u)}</span>` : ""}${x.home === "some" ? ` <span class="tag">some at home</span>` : x.had ? ` <span class="tag">${fmtQ(x.had, x.u)} at home</span>` : ""}</div>${x.for.length ? `<div class="tiny muted ell">${esc(x.for.join(", "))}</div>` : ""}</div>${x.ex ? `<button class="iconbtn" data-act="delExtra" data-id="${x.ex}" aria-label="Remove">${ic("x")}</button>` : ""}</div>`; }).join("")}</div>`, { right: `<span class="tiny">${g.filter(x => !isDone(done, x)).length} left</span>`, tight: true, b: a === "m" || a === "f" || a === "x" });
  }).filter(Boolean);
  const homeC = athome.length ? card(`Already at home · ${athome.length}`, `<div class="list">${athome.map(x => `<div class="item"><span class="emo" style="width:30px;height:30px;background:var(--okbg);color:var(--ok)">${ic("check", "i16")}</span><div class="grow"><div class="nm">${esc(capF(x.n))}</div><div class="tiny muted">need ${fmtQ(x.q, x.u)} · you have ${x.had == null ? "some" : fmtQ(x.had, x.u)}</div></div></div>`).join("")}</div><p class="help">Left off the list because your kitchen has enough.</p>`, { tight: true }) : "";

}

// ------------------------------------------------------------ recipes
const RF = { all: "All", go: "Go-tos", e0: "Barely any energy", e1: "Some energy", e2: "Feeling good", q: "15 min or less", v: "Vegetarian", k: "Kids like it", f: "Freezes well", have: "What I have", bl: "Breakfast & lunch", mine: "Mine" };
function vRecipes() {
  let rs = MP.recipes(S); const f = VS.rf, q = VS.q.trim().toLowerCase();
  if (f === "go") rs = rs.filter(r => S.go.includes(r.id)); else if (f === "mine") rs = rs.filter(r => r.id[0] === "m");
  else if (f[0] === "e" && f.length === 2) rs = rs.filter(r => r.e === +f[1] && r.slot === "dinner"); else if (f === "bl") rs = rs.filter(r => r.slot !== "dinner");

  if (q) rs = rs.filter(r => r.n.toLowerCase().includes(q) || r.i.some(x => parseIng(x).n.toLowerCase().includes(q)));
  const top = head(`${MP.recipes(S).length} in your kitchen`, "Recipes", `<button class="btn pri" data-act="newRecipe">${ic("plus")}Add your recipe</button>`, `Sorted by the energy they take. ${DIETS.find(d => d[0] === S.settings.diet)[1] === "Everything" ? "" : DIETS.find(d => d[0] === S.settings.diet)[1] + " only."}`);
  const bar = `<section class="card"><div class="body"><input class="inp" id="q" placeholder="Search a recipe or an ingredient – what's in your fridge?" value="${esc(VS.q)}" autocomplete="off"><div class="row wrap mt" style="gap:6px">${Object.entries(RF).map(([k, l]) => `<button class="cat ${f === k ? "on" : ""}" data-act="rf" data-v="${k}">${l}</button>`).join("")}</div></div></section>`;
  const list = rs.length ? `<div class="rgrid mt">${rs.map(r => `<button class="rcard" data-act="recipe" data-id="${r.id}">${rIcon(r)}<span class="grow"><b>${esc(r.n)}</b><span class="tiny muted">${r.t} min · ${r.slot === "dinner" ? ENERGY[r.e][0].toLowerCase() + " energy" : r.slot}${(S.pantry || []).length ? (c => ` · <span style="color:${c.have === c.n ? "var(--ok)" : "inherit"}">have ${c.have}/${c.n}</span>`)(MP.coverage(S, r)) : ""}</span></span><span class="m2">${meter(r.e)}${S.go.includes(r.id) ? `<span style="color:var(--b)">${ic("heart", "i16")}</span>` : ""}</span></button>`).join("")}</div>` : `<div class="empty mt">Nothing matches. <button class="link" data-act="rf" data-v="all">Show all</button></div>`;

// ------------------------------------------------------------ month
function vMonth() {
  const m = curMonth(), first = m + "-01", t = today(), ws = S.settings.weekStart;
  const start = E.weekStart(first, ws), last = E.addDays(E.ymAdd(m, 1) + "-01", -1), end = E.addDays(E.weekStart(last, ws), 6);
  const pick = `<div class="monthpick"><button class="iconbtn" data-act="mPrev" aria-label="Previous month">${ic("left")}</button><b>${mname(m)}</b><button class="iconbtn" data-act="mNext" aria-label="Next month">${ic("right")}</button></div>`;
  let cells = "", home = 0, out = 0, planned = 0;
  for (let d = start; d <= end; d = E.addDays(d, 1)) {
    const p = MP.slot(S, d), q = slotName(p), inM = d.slice(0, 7) === m;
    if (inM && p) { if (p.out) out++; else if (p.done) home++; if (q) planned++; }
    cells += `<button class="mday ${inM ? "" : "off"} ${d === t ? "today" : ""} ${isLow(d) ? "low" : ""}" data-act="dayMenu" data-d="${d}"><span class="dn">${+d.slice(8)}</span>${q ? `<span class="mn"><span class="ic" style="color:${p.out ? "var(--b)" : "var(--a)"}">${ic(q.c)}</span>${esc(q.n)}</span>` : ""}${p && p.done ? `<i class="dot ok"></i>` : ""}</button>`;
  }
  const dows = [0, 1, 2, 3, 4, 5, 6].map(i => DOW[(i + ws) % 7]);
  const top = head(`Plan ahead · ${m.slice(0, 4)}`, MONTHS[+m.slice(5) - 1], pick, `${planned} dinners planned · ${home} eaten at home · ${out} out or ordered in`);
  return top + `<section class="card"><div class="body"><div class="mgrid">${dows.map(x => `<div class="caps mh">${x}</div>`).join("")}${cells}</div>
    <div class="hleg mt"><span><i style="background:var(--okbg);border:1px solid var(--ok)"></i>eaten</span><span><i style="background:var(--warnbg)"></i>low-energy day</span><span>Tap any day to plan or change it.</span></div></div></section>`;
}

// ------------------------------------------------------------ fridge & freezer
function vKitchen() {
  const t = today();
  const frz = card("Freezer shelf", S.freezer.filter(z => z.portions > 0).length ? `<div class="list">${[...S.freezer].filter(z => z.portions > 0).sort((a, b) => a.date < b.date ? -1 : 1).map(z => { const age = E.diff(z.date, t), old = age > 90; return `<div class="item"><div class="emo" style="color:var(--b)">${ic("snow")}</div><div class="grow"><div class="nm">${esc(z.n)}</div><div class="tiny ${old ? "badc" : "muted"}">${plural(z.portions, "portion")} · frozen ${age < 14 ? age + " days" : Math.round(age / 7) + " weeks"} ago${old ? " · best eaten soon" : ""}</div>

  const top = head("Less food in the bin", "Fridge & freezer", `<button class="btn" data-act="addFridge">${ic("plus")}Add to fridge</button><button class="btn pri" data-act="addFrz">${ic("snow")}Add to freezer</button>`, "What needs eating first, and what's ready to heat.");

  return top + stats + `<div class="grid g2 start">${fridgeCard(0)}${frz}</div>`;
}

// ------------------------------------------------------------ household
function vHousehold() {
  const people = card("Who's eating", `<div class="list">${S.people.map(p => `<div class="item click" data-act="editPerson" data-id="${p.id}"><div class="face on lg">${esc(p.name.slice(0, 1).toUpperCase())}</div><div class="grow"><div class="nm">${esc(p.name)}${p.kid ? ` <span class="tag">child</span>` : ""}</div><div class="tiny muted">${p.no.length ? "Doesn't eat: " + esc(p.no.join(", ")) : "Eats everything"}</div></div>${ic("right")}</div>`).join("") || `<div class="empty">Add the people you cook for.</div>`}</div>
    <button class="btn sm mt" data-act="editPerson">${ic("plus")}Add a person</button><p class="help">Amounts follow who's eating – a child counts as half. Tap faces on Tonight when someone's out. Dinners with something a person won't eat are left out of the suggestions on days they eat with you.</p>`, { tight: true });
  const th = S.settings.themes || {};
  const rhythm = card("Your week's rhythm", `<p class="small muted" style="margin-top:0">Fill my week follows this. Low-energy days only get dinners that take no energy.</p><div class="list">${[1, 2, 3, 4, 5, 6, 0].map(dw => `<div class="item"><span class="grow nm">${DOWL[dw]}</span><select class="inp sm" style="width:auto" data-theme-dow="${dw}">${[["", "Anything"], ["low", "Low-energy day"], ["veg", "Meat-free"], ["out", "Eat out / order in"]].map(([v, l]) => opt(v, l, th[dw] || "")).join("")}</select></div>`).join("")}</div>`, { b: true, tight: true });
  return head("Everyone at the table", "Household", "", "Who's eating, what they won't eat, and how your week usually goes.") + `<div class="grid g2 start">${people}${rhythm}</div>`;

// ------------------------------------------------------------ insights
function vInsights() {
  const t = today(), W = MP.weeks(S, t, 8), st = S.settings, labels = W.map((w, i) => i === W.length - 1 ? "This wk" : dshort(w.s));
  const m0 = t.slice(0, 8) + "01"; let home = 0, left = 0, out = 0;
  for (let d = m0; d <= t; d = E.addDays(d, 1)) { const p = MP.slot(S, d); if (!p) continue; if (p.out) out++; else if ((p.frz || p.left) && p.done) left++; else if (p.done) home++; }
  const takeM = E.sum(S.spend.filter(x => x.kind === "take" && x.date >= m0), x => x.amount), grocAvg = E.sum(W.slice(0, -1), w => w.groc) / Math.max(1, W.length - 1);
  const saved = Math.max(0, (home + left) * MP.portions(S) * (st.takeout - st.home));
  const tiles = `<div class="tiles" style="grid-template-columns:repeat(4,minmax(0,1fr))">${tile("Home dinners", home + left, "this month", "ok")}${tile("Saved vs. takeout", fmt0(saved), "this month, roughly", "ok")}${tile("Groceries", fmt0(grocAvg), st.groc ? `a week on average · budget ${fmt0(st.groc)}` : "a week on average", st.groc && grocAvg > st.groc ? "bad" : "")}${tile("Takeout", fmt0(takeM), "this month")}</div>`;
  const dinners = card("Dinners per week", barChart([{ name: "Cooked", color: "var(--a)", vals: W.map(w => w.home) }, { name: "Leftovers & freezer", color: "var(--a2)", vals: W.map(w => w.left) }, { name: "Ate out", color: "var(--b2)", vals: W.map(w => w.out) }], labels, { stack: true, h: 220, fv: v => Math.round(v), label: "Dinners per week" }) +
    `<div class="hleg"><span><i style="background:var(--a)"></i>cooked</span><span><i style="background:var(--a2)"></i>leftovers & freezer</span><span><i style="background:var(--b2)"></i>ate out / ordered</span></div>`);
  const money = card("Food money per week", barChart([{ name: "Groceries", color: "var(--b)", vals: W.map(w => w.groc) }, { name: "Takeout", color: "var(--b2)", vals: W.map(w => w.take) }], labels, { h: 220, ref: st.groc || null, label: "Food money per week" }) +
    `<div class="hleg"><span><i style="background:var(--b)"></i>groceries</span><span><i style="background:var(--b2)"></i>takeout</span>${st.groc ? `<span><i style="background:none;border-top:2px dashed var(--ink2);height:0;width:14px;border-radius:0"></i>weekly budget</span>` : ""}</div>`, { b: true });
  const parts = [{ name: "Cooked", v: home, color: "var(--a)" }, { name: "Leftovers & freezer", v: left, color: "var(--a2)" }, { name: "Ate out", v: out, color: "var(--b2)" }], tot = home + left + out;
  const donutC = card(`Where dinners came from · ${MONTHS[+t.slice(5, 7) - 1]}`, tot ? `<div class="donutwrap">${donut(parts.map(p => ({ ...p, v: p.v })), 132, 24, `<text x="50%" y="47%" text-anchor="middle" font-family="Bodoni,serif" font-size="22" fill="var(--ink)">${tot}</text><text x="50%" y="61%" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="var(--ink2)">DINNERS</text>`).replace(/: [^"]*· /g, ": ")}<div class="legend">${parts.map(p => legendRow(p.color, p.name, p.v)).join("")}</div></div>` : `<div class="empty">Tick dinners as eaten and this fills up.</div>`);
  const ec = [0, 0, 0]; Object.entries(S.energy).forEach(([d, v]) => { if (E.diff(d, t) <= 30 && E.diff(d, t) >= 0) ec[v]++; }); const et = ec[0] + ec[1] + ec[2];
  const lowDays = [0, 1, 2, 3, 4, 5, 6].map(dw => ({ dw, n: Object.entries(S.energy).filter(([d, v]) => v === 0 && E.dow(d) === dw && E.diff(d, t) <= 56).length })).sort((a, b) => b.n - a.n)[0];
  const energy = card("Your energy at dinner time · 30 days", et ? ENERGY.map(([n], l) => `<div class="budrow"><div class="top"><span class="nm">${meter(l)} ${n}</span><span class="small num"><b>${ec[l]}</b> <span class="muted">${plural(ec[l], "day")}</span></span></div>${bar(ec[l] / et)}</div>`).join("") +
    (lowDays && lowDays.n >= 2 && (S.settings.themes || {})[lowDays.dw] !== "low" ? `<p class="small" style="margin-bottom:0">${DOWL[lowDays.dw]}s are often low. <button class="link" data-act="setLow" data-v="${lowDays.dw}">Make ${DOWL[lowDays.dw]} a low-energy day</button></p>` : "") : `<div class="empty">Tap your energy on Tonight and you'll see your pattern here.</div>`, { b: true });
  return head("No streaks. Only wins.", "Insights", "", "What went well – and where the money went.") + tiles + `<div class="grid g2 mt start">${dinners}${money}</div><div class="grid g2 mt start">${donutC}${energy}</div><div class="grid g2 mt start">${boughtCard(6)}${pantryMix()}</div>`;
}

function pantryMix() {
  const cols = ["var(--a)", "var(--a2)", "var(--b)", "var(--b2)", "var(--ink2)", "var(--line2)", "var(--bg2)"], P = S.pantry || [];
  const parts = AORDER.map((a, i) => ({ name: AISLE[a], v: P.filter(p => (p.a || "x") === a).length, color: cols[i] })).filter(p => p.v);
  const W = MP.weeks(S, today(), 8).slice(0, -1), b = S.settings.groc, under = b ? W.filter(w => w.groc && w.groc <= b).length : 0;
  return card("What's in your kitchen", (P.length ? `<div class="donutwrap">${donut(parts, 132, 24, `<text x="50%" y="47%" text-anchor="middle" font-family="Bodoni,serif" font-size="22" fill="var(--ink)">${P.length}</text><text x="50%" y="61%" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="var(--ink2)">AT HOME</text>`).replace(/: [^"]*· /g, ": ")}<div class="legend">${parts.map(p => legendRow(p.color, p.name, p.v)).join("")}</div></div>` : `<div class="empty">Log a shopping trip and your kitchen shows up here.</div>`) +
    (b ? `<p class="small" style="margin:12px 0 0">You stayed within your grocery budget <b>${under} of the last ${W.length} weeks</b>.</p>` : ""), { b: true });
}

/* modals: day menu, decide, plans changed, recipes, cook mode, people, fridge, freezer, money */
const optRow = (x, d, low, act = "pick", slot = "dinner") => `<div class="item click" data-act="${act}" data-id="${x.id}" data-d="${d}" data-slot="${slot}">${rIcon(x)}<div class="grow"><div class="nm">${esc(x.n)}</div><div class="tiny muted">${x.t} min · ${esc(MP.reason(S, x, d, low))}</div></div>${ic("right")}</div>`;
function setSlot(d, slot, v) { S.plan[d] = S.plan[d] || {}; if (v) S.plan[d][slot] = v; else delete S.plan[d][slot]; }
